# ============================================================================
# Coordinare preset: any OpenAI-compatible endpoint (vLLM, LM Studio, your own LiteLLM, ...)
# ============================================================================
#
# The shortest path from a clone to a first dispatched card. Everything you must
# change is marked CHANGE ME. Everything else is a working default.
#
#   1. Start your endpoint and note its base URL and a model name it serves.
#   2. Put its API key in .env as OPENAI_COMPATIBLE_API_KEY (or drop auth_env if
#      the endpoint needs no auth).
#   3. Set the CHANGE ME values below.
#   4. Validate:  .venv/bin/python -m coordinare --config config.yaml config validate
#   5. Preflight: .venv/bin/python -m coordinare --config config.yaml doctor
#   3. Validate the file parses:
#        .venv/bin/python -m coordinare --config config.yaml config validate
#   4. Preflight (checks your endpoint actually answers, models exist,
#      and the GitHub token has the permissions each feature needs):
#        .venv/bin/python -m coordinare --config config.yaml doctor
#
# This preset configures the MINIMUM set of roles needed to see a card move end
# to end. The other roles are listed, commented, at the bottom: add them once
# the basic loop works rather than provisioning nine roles before you have seen
# one card succeed.
# ============================================================================

github_org: your-org-or-username        # CHANGE ME
github_token: "${COORDINARE_GITHUB_TOKEN}"   # set in .env; never commit a token
human_reviewers:
  - your-github-username                # CHANGE ME  (only humans approve PRs)

# Your token needs specific fine-grained permissions. The exact list, per
# feature, is in docs/security/threat-model.md — including two that are easy to
# miss (Issues needs WRITE, and branch-protection reads need Administration).

agent_transport: subprocess
agent_executable: bin/run-performer

# Anything speaking the OpenAI chat-completions API works here: vLLM, LM Studio,
# a self-hosted LiteLLM gateway, or a hosted provider. The base_url is whatever
# answers /v1/chat/completions, WITHOUT the /chat/completions suffix.
# kind: vllm is coordinare's generic "OpenAI-compatible endpoint at a base_url".
# It is NOT vLLM-specific: LM Studio, a self-hosted LiteLLM gateway, and anything
# else speaking /v1/chat/completions all use it. (kind: openai is reserved for
# the native OpenAI API and rejects base_url, which is why it is not used here.)
endpoints:
  - name: openai-compatible
    kind: vllm
    base_url: https://your-endpoint.example/v1     # CHANGE ME
    auth_env: OPENAI_COMPATIBLE_API_KEY            # drop this line if no auth is needed

model_endpoints:
  - {name: coder, endpoint: openai-compatible, model: "your-model-name"}   # CHANGE ME

modes:
  - {name: single-coder, strategy: single, tool: coder}

# ---------------------------------------------------------------------------
# The minimum viable role set.
# ---------------------------------------------------------------------------
# implementer writes the code and opens the PR; reviewer reads it back. That is
# enough for a complete card. Unconfigured roles are skipped, not failed.
performers:
  default:
    backend: opencode
    mode: single-coder
    effort: medium
    temperature: 0.2
    max_tokens: 8192
  implementer:
    effort: high
    max_tokens: 16384
  reviewer:
    effort: medium

  # Add these once the basic loop works. Each is optional.
  # assessor:    {effort: low}      # checks a card has enough context first
  # architect:   {effort: high}     # commits a plan before implementation
  # security:    {effort: medium}   # runs the security scan gate
  # qa:          {effort: medium}   # validates acceptance criteria
  # tech_writer: {effort: low}      # maintains docs/wiki
  # closer:      {effort: low}      # final pass before human review

symphonies:
  - name: main
    github_project_number: 1              # CHANGE ME  (your GitHub Project number)

# Loopback only. The dashboard has NO authentication: see
# docs/security/threat-model.md before changing dashboard_host.
dashboard_host: 127.0.0.1
dashboard_port: 8090
log_level: info
