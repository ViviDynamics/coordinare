    \   return '<select name=\"workspace\"><option>Acme HQ</option><option>Acme EU</option></select>'\n\
    \    if name == \"Password\":\n        return '<input type=\"password\" name=\"password\">'\n    return\
    \ '<input name=\"%s\">' % name.lower()\n\n\ndef render():\n    rows = \"\".join(\n        '<label>%s</label>%s'\
    \ % (f, _control(f)) for f in FIELDS\n    )\n    return (\n        \"<html><body><h1>Sign in</h1><form>\"\
    \n        + rows\n        + \"<button>Continue</button></form></body></html>\"\n    )\n\n\nclass H(BaseHTTPRequestHandler):\n\
    \    def do_GET(self):\n        self.send_response(200)\n        self.send_header(\"Content-Type\"\
    , \"text/html\")\n        self.end_headers()\n        self.wfile.write(render().encode())\n\n    def\
    \ log_message(self, *a):\n        pass\n\n\nif __name__ == \"__main__\":\n    HTTPServer((\"127.0.0.1\"\
