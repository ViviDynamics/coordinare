# =============================================================================
# Coordinare Configuration Example — OpenCode Backend
# =============================================================================
#
# Minimal config for running performers on the OpenCode CLI. See
# config.example.yaml for the full reference.
#
# How OpenCode runs under coordinare:
#   - Persistent CLI session per card (the adapter manages start/stop).
#   - Authentication — TWO supported modes:
#       (A) Mounted creds (vendor models): OpenCode reads provider API keys
#           from ~/.opencode/config.json inside the container. Mount the host
#           directory read-only so the same credentials are available to every
#           job. Use this to drive Anthropic/OpenAI/etc. hosted models.
#       (B) Self-hosted OpenAI-compatible provider (077 US4, no login): set the
#           OPENCODE_PROVIDER_* env vars on the endpoint and the adapter writes
#           an opencode.json custom provider at job start — NO ~/.opencode mount
#           needed. Routes every role to one OpenAI-compatible endpoint (e.g. a
#           LiteLLM proxy serving a self-hosted model). See the second endpoint
#           example below.
#   - Image: build a OpenCode-capable image with the `opencode` CLI installed
#     (the entrypoint `opencode)` arm also installs/upgrades it on start).
# =============================================================================


# --- GitHub ---

github_org: "your-org"
github_token: "${COORDINARE_GITHUB_TOKEN}"
github_auth: "pat"

human_reviewers:
  - "your-github-handle"


# --- Symphonies ---

symphonies:
  - name: my-project
    github_project_number: 1


# --- Containerized Performer (OpenCode) ---
#
# Prerequisites:
#   1. Install and configure the `opencode` CLI on the coordinare host so
#      ~/.opencode/config.json contains the provider credentials you want.
#   2. Build a OpenCode-capable image:
#        docker build -t coordinare-performer:opencode \
#          -f agent/performer/Dockerfile.opencode .
#   3. The mount is read-only; refresh tokens on the host before they lapse.

performer_endpoints:
  - id: opencode-ephemeral
    mode: ephemeral
    roles:
      - assessor
      - architect
      - implementer
      - reviewer
      - security
      - qa
      - tech_writer
      - closer
    image: coordinare-performer:opencode
    volumes:
      - host_path: /home/youruser/.opencode   # adjust to your actual home dir
        container_path: /root/.opencode
        mode: ro
    # service_inference (env_bootstrap role only) — provider seam for the
    # bootstrap agent's LLM-driven service discovery (commit 8eefef3).
    # OpenCode reads provider keys from the mounted ~/.opencode config;
    # service_inference is independent. Set PROVIDER=openai_compat with
    # BASE_URL / API_KEY / MODEL to route through a self-hosted endpoint;
    # otherwise the default `anthropic` provider needs ANTHROPIC_API_KEY.
    # env:
    #   COORDINARE_INFERENCE_PROVIDER:       "${COORDINARE_INFERENCE_PROVIDER}"
    #   COORDINARE_INFERENCE_MODEL:          "${COORDINARE_INFERENCE_MODEL}"
    #   COORDINARE_INFERENCE_BASE_URL:       "${COORDINARE_INFERENCE_BASE_URL}"
    #   COORDINARE_INFERENCE_API_KEY:        "${COORDINARE_INFERENCE_API_KEY}"
    #   COORDINARE_INFERENCE_MAX_TOKENS:     "${COORDINARE_INFERENCE_MAX_TOKENS}"
    #   COORDINARE_INFERENCE_MAX_TOOL_CALLS: "${COORDINARE_INFERENCE_MAX_TOOL_CALLS}"
    #   COORDINARE_INFERENCE_AGENT_VERSION:  "${COORDINARE_INFERENCE_AGENT_VERSION}"

# --- Mode (B): self-hosted OpenAI-compatible provider, NO login mount (077) ---
#
# When OPENCODE_PROVIDER_BASE_URL is set, OpenCodeAdapter writes an opencode.json
# custom provider (@ai-sdk/openai-compatible) into the workspace at job start and
# routes the session modelID as `<OPENCODE_PROVIDER_NAME>/<model>` (e.g.
# litellm/spark/qwen3.6:35b). No ~/.opencode mount and no `compat` block are
# needed — the AI-SDK openai-compatible client uses standard system/user roles.
# The API key is resolved in-container from OPENCODE_PROVIDER_ENV_KEY via
# opencode's `{env:VAR}` syntax. Verified end-to-end against LiteLLM +
# spark/qwen3.6:35b (research.md R-03).
#
#   - id: opencode-ephemeral
#     mode: ephemeral
#     roles: [ env_bootstrap ]          # or any role(s)
#     image: coordinare-performer:full
#     env:
#       BACKEND: opencode
#       OPENCODE_PROVIDER_BASE_URL: https://litellm.example.com/v1
#       OPENCODE_PROVIDER_NAME: litellm        # becomes the modelID prefix
#       OPENCODE_PROVIDER_ENV_KEY: LITELLM_MASTER_KEY   # in-container key var
#       LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
#       # service_inference (env_bootstrap role) — same COORDINARE_INFERENCE_*
#       # seam as above; its timeout stays non-fatal (the bootstrap completes
#       # with inference skipped rather than failing).


# --- Performers ---

# --- 080: model catalogs (declare once, reference per performer by `mode`) ---
endpoints:
  - {name: anthropic-cloud, kind: anthropic, auth_env: ANTHROPIC_API_KEY}
model_endpoints:
  - {name: claude-sonnet-4-6, endpoint: anthropic-cloud, model: claude-sonnet-4-6}
  - {name: claude-haiku-4-5-20251001, endpoint: anthropic-cloud, model: claude-haiku-4-5-20251001}
modes:
  - {name: single-claude-sonnet-4-6, strategy: single, tool: claude-sonnet-4-6}
  - {name: single-claude-haiku-4-5-20251001, strategy: single, tool: claude-haiku-4-5-20251001}

performers:
  default:
    backend: opencode
    mode: single-claude-sonnet-4-6           # any model id your ~/.opencode config serves
    temperature: 0.2
    max_tokens: 8192

  assessor:
    mode: single-claude-haiku-4-5-20251001
    temperature: 0.0
    max_tokens: 2048

  implementer:
    max_tokens: 16384

  reviewer:
    temperature: 0.0

  security:
    temperature: 0.0

  qa:
    max_tokens: 12288
    temperature: 0.0

  closer:
    mode: single-claude-haiku-4-5-20251001
    temperature: 0.0
    max_tokens: 2048

# 076 — Dispatcher dedup + reconciliation tunables (defaults from spec 076 Q1-Q5).
dispatcher_dedup:
  enabled: true
  reconciliation_budget_seconds: 30
  drain_budget_seconds: 5
  reap_budget_seconds: 5
  idle_timeout_retries: 2
  idle_timeout_window_hours: 24
  empty_output_retries: 1
  empty_output_window_hours: 24
  wedge_block_threshold: 3
  wedge_block_window_hours: 24
  multi_pr_check_triggers: [dispatch, restart, webhook]
