[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coordinare-service-inference"
version = "0.1.0"
description = "Shared env-cache service inference (manual override + LLM agent). Used by coordinare daemon and performer image."
# Covered by the repository-root LICENSE and NOTICE (Elastic License 2.0).
# No separate license file here, and no OSI classifier.
license = "LicenseRef-Elastic-License-2.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "jinja2>=3.1",
    "pydantic>=2.9",
    "stamina>=24.2.0,<25",
    "structlog>=24.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
coordinare_service_inference = ["templates/*.j2"]
