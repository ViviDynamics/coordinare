# =============================================================================
# Coordinare Configuration Example
# =============================================================================
#
# Config Discovery (4-path search order, first match wins):
#   1. --config <path>              CLI flag (highest priority)
#   2. COORDINARE_CONFIG_PATH        Environment variable pointing to a file
#   3. ./config.yaml                Current working directory
#   4. ~/.coordinare/config.yaml     User home directory
#
# Environment Variable Overrides:
#   Any scalar field can be omitted from this file and supplied as an
#   environment variable instead: COORDINARE_<FIELD_NAME> (uppercase).
#   Examples:
#     COORDINARE_GITHUB_TOKEN=ghp_...
#     COORDINARE_POLL_INTERVAL_SECONDS=60
#     COORDINARE_LOG_LEVEL=debug
#
#   Note: List/nested fields (e.g. notifications.channels) must be defined
#   in the config file; they cannot be supplied via environment variables.
#
#   Coordinare starts successfully with NO config file if all required fields
#   are supplied via COORDINARE_* environment variables (useful for CI/CD).
#
# =============================================================================
# TWO SUPPORTED FORMATS
# =============================================================================
#
# FORMAT A — Multi-Symphony (recommended for multi-project setups):
#   Global settings live at the root level. Projects are declared under
#   `symphonies:`, each with their own name and github_project_number.
#   Per-symphony `overrides:` can override any global field for that project.
#   Format is detected automatically by the presence of a non-empty `symphonies:` list.
#
# FORMAT B — Legacy Flat (still supported, single-project):
#   All fields (including project_name and github_project_number) at the root.
#   No `symphonies:` or `orchestra:` keys.
#   (See the legacy example at the bottom of this file.)
#
# Required global fields: github_org, github_token or github_auth:app,
#                         human_reviewers
# Required per-symphony:  name, github_project_number
#
# project_name note: identifies the GitHub repo for REST operations (branch
#   checks, PR queries, git clone). Defaults to the symphony name when not
#   set. If your repo name differs from the symphony name, set it globally
#   or per-symphony via overrides: {project_name: my-repo}.
# =============================================================================


# =============================================================================
# FORMAT A — Multi-Symphony Configuration
# =============================================================================

# --- GitHub Organization ---

github_org: "your-org"   # Required. The GitHub org/user that owns the repos.

# --- Authentication (choose one) ---

# Option A: Personal Access Token (PAT)
# github_token: "${COORDINARE_GITHUB_TOKEN}"
# github_auth: "pat"     # "pat" (default) | "app"

# Option B: GitHub App (recommended for production — no token expiry)
# github_auth: "app"
# github_app_id: 12345                          # App ID from GitHub App settings
# github_private_key_path: /path/to/key.pem     # Private key downloaded from GitHub
# github_installation_id: 67890                 # Installation ID for your org/repo

# --- GitHub Enterprise (optional) ---
# github_api_url: "https://github.example.com/api/v3"
# github_graphql_url: "https://github.example.com/api/graphql"

# --- Agent Transport ---
# Controls how coordinare spawns the performer process.
#
# Modes:
#   subprocess  — run performer as a local child process (default; simplest setup)
#   ssh         — connect to a remote host and run performer there
#   kubernetes  — dispatch to a Kubernetes job (uses performer_image)
#
# For containerized performers, use performer_endpoints instead (see below).
agent_transport: "subprocess"         # "subprocess" | "ssh" | "kubernetes"
agent_executable: "bin/run-performer"  # portable wrapper (sources .env, runs via uv); launch coordinare from the repo root
# Alternatively, an absolute path built from your clone, e.g. /path/to/coordinare/bin/run-performer
# transport_timeout_seconds: 30       # seconds to wait for a response; range 1–300

# SSH-specific (only when agent_transport: ssh):
# agent_host: "performer.example.com"
# agent_port: 22
# agent_user: "ubuntu"
# agent_key_path: "~/.ssh/id_ed25519"

# --- Containerized Performer Endpoints (spec 056) ---
# Register Docker-based performers. Each entry can cover multiple roles.
# Modes:
#   ephemeral  — a fresh container is spun up per card dispatch and torn down
#                when the job reaches a terminal state. Requires `image`.
#   persistent — a long-running container at a fixed URL. Requires `image`
#                and `endpoint`.
#   subprocess — legacy entry with no container; just maps roles to the
#                subprocess transport. Must not set image/endpoint/volumes.
#
# All entries are optional. If omitted, coordinare uses agent_transport above.
#
# Volumes:
#   host_path      — absolute path on the coordinare host machine
#   container_path — absolute path inside the container (typically /root/... for root user)
#   mode           — "ro" (read-only, default) | "rw" (read-write)
#
# API keys / secrets:
#   coordinare forwards secrets into each container job based on the backend:
#     GITHUB_TOKEN      — always forwarded from the workspace GitHub credential
#     OPENAI_API_KEY    — forwarded only when backend == "codex"
#     ANTHROPIC_API_KEY — forwarded only when backend == "claude_code"
#   No volumes are needed for these. Other credentials must be injected via
#   volume mounts or baked into a custom image — they are NOT forwarded
#   automatically even if set in the coordinare host environment.
#
# performer_endpoints:

#   # -------------------------------------------------------------------------
#   # Codex (OpenAI) — uses OPENAI_API_KEY forwarded from coordinare environment.
#   # Build image: docker build -t coordinare-performer:full -f agent/performer/Dockerfile .
#   # -------------------------------------------------------------------------
#   - id: codex-ephemeral
#     mode: ephemeral                # "ephemeral" | "persistent" | "subprocess"
#     roles:                         # which lifecycle roles this endpoint handles
#       - assessor
#       - architect
#       - implementer
#       - reviewer
#       - security
#       - qa
#       - tech_writer
#       - closer
#     image: coordinare-performer:full  # Docker image to run
#     readiness_timeout_s: 120         # seconds to wait for container /health; default 120
#     failure_threshold: 5             # consecutive health failures before circuit-break; default 5
#     # auth_token: "${PERFORMER_TOKEN}"  # Bearer token for HTTP API; optional
#     # env:                             # forwarded into the container as -e KEY=VAL
#     #   RTK_ENABLED: "1"               # opt-in token-compression hook (default off);
#     #                                  # codex and claude backends only. Run one
#     #                                  # endpoint with this on and an otherwise-identical
#     #                                  # peer with it off to A/B token savings.
#     # egress_allowlist:                # opt-in egress baseline (default: unrestricted).
#     #   - api.github.com               # When set, coordinare adds --cap-add=NET_ADMIN and
#     #   - objects.githubusercontent.com # the container resolves each host at startup (v4
#     #   - codeload.github.com          # AND v6), then sets `iptables -P OUTPUT DROP` plus
#     #                                  # the same on ip6tables, with exceptions for
#     #                                  # loopback / ESTABLISHED / DNS / resolved IPs.
#     #                                  # NOT a compliance boundary: cloud IPs churn, DNS
#     #                                  # tunnels remain open, and other consumers of an
#     #                                  # allowed IP are reachable. For durable enforcement
#     #                                  # put a proxy (squid/envoy) in front of the
#     #                                  # container instead.

#   # -------------------------------------------------------------------------
#   # Claude Code — uses ANTHROPIC_API_KEY forwarded from coordinare environment.
#   # Build image: docker build -t coordinare-performer:full -f agent/performer/Dockerfile .
#   # No volumes required; the key is injected via the job payload.
#   # -------------------------------------------------------------------------
#   - id: claude-ephemeral
#     mode: ephemeral
#     roles: [implementer, reviewer]
#     image: coordinare-performer:full

#   # -------------------------------------------------------------------------
#   # Browser-driven QA — use coordinare-performer:extra for roles that run
#   # browser-backed tests (capybara/selenium/playwright system specs). The gems
#   # install fine via env-bootstrap, but the browser BINARIES are what bootstrap
#   # keeps failing to get going, so :extra bakes chromium + firefox-esr into the
#   # image (and real google-chrome-stable when built for amd64).
#   #   Build:  docker build -t coordinare-performer:full  -f agent/performer/Dockerfile.full  agent/performer/
#   #           docker build -t coordinare-performer:extra -f agent/performer/Dockerfile.extra agent/performer/
#   # Point only the browser-test role(s) at it (e.g. qa) to keep other images lean.
#   # -------------------------------------------------------------------------
#   - id: claude-qa-ephemeral
#     mode: ephemeral
#     roles: [qa]
#     image: coordinare-performer:extra

#   # -------------------------------------------------------------------------
#   # Junie (JetBrains) — authenticates via a persistent session directory.
#   #
#   # Prerequisites:
#   #   1. Log in to your JetBrains account on the coordinare host (e.g. via
#   #      the Junie CLI: `junie login`).
#   #   2. Confirm ~/.junie/ exists with valid credentials.
#   #   3. Build a Junie-capable image with the `junie` CLI installed:
#   #        docker build -t coordinare-performer:junie \
#   #          -f agent/performer/Dockerfile.junie .
#   #
#   # Caveats:
#   #   - JetBrains tokens encode a device fingerprint and are tied to
#   #     the device that completed the OAuth flow; test headless auth first.
#   #   - Mount read-only; expired tokens cannot be refreshed inside the container.
#   #   - If your JetBrains config lives elsewhere (e.g. XDG_CONFIG_HOME), adjust
#   #     host_path accordingly.
#   # -------------------------------------------------------------------------
#   - id: junie-ephemeral
#     mode: ephemeral
#     roles: [implementer]
#     image: coordinare-performer:junie
#     volumes:
#       - host_path: /home/youruser/.junie   # adjust to your actual home dir
#         container_path: /root/.junie
#         mode: ro

#   # -------------------------------------------------------------------------
#   # Persistent GPU performer — long-running container on a remote host.
#   # Coordinare will health-check it on startup and route matching roles to it.
#   # -------------------------------------------------------------------------
#   - id: persistent-gpu
#     mode: persistent
#     roles: [implementer]
#     image: coordinare-performer:gpu
#     endpoint: "http://gpu-host:8080"   # must be reachable from coordinare

#   # -------------------------------------------------------------------------
#   # Env-bootstrap performer (spec 060) — installs per-symphony tooling into a
#   # host-path volume that other performers then receive read-only.
#   #
#   # How it works:
#   #   1. Coordinare polls the SHA of each symphony's env_spec_files (e.g. README.md).
#   #   2. When a change is detected it dispatches an "env_bootstrap" job to this
#   #      performer with the file content as the payload.
#   #   3. The performer reads the spec, installs tools/deps into /devenv/<name>,
#   #      and exits.  The directory is then mounted read-only into every subsequent
#   #      card job for that symphony.
#   #
#   # Requirements:
#   #   - The image must contain whatever tooling the bootstrap script needs
#   #     (apt, pip, nix, asdf, etc.).
#   #   - coordinare needs write access to env_cache_root on the host; it creates
#   #     the per-symphony subdirectory automatically before dispatching.
#   #   - Reference this entry's `id` in each symphony's `env_bootstrap_performer_id`.
#   # -------------------------------------------------------------------------
#   - id: bootstrap-env
#     mode: ephemeral
#     roles: []                          # env_bootstrap jobs are not tied to a lifecycle role
#     image: coordinare-performer:full    # swap for a custom image if extra tools are needed
#     readiness_timeout_s: 300           # bootstrap jobs can be slow; give the container time
#     # env_bootstrap runs an LLM-driven service-discovery step (coordinare_service_inference).
#     # Provider seam (commit 8eefef3): default `anthropic` uses ANTHROPIC_API_KEY; set
#     # COORDINARE_INFERENCE_PROVIDER=openai_compat with BASE_URL / API_KEY / MODEL to
#     # route through any self-hosted OpenAI-compatible endpoint (LiteLLM, vLLM, Ollama).
#     # These vars MUST be listed here for ${VAR} expansion to forward them into the
#     # container — they are not inherited from the coordinare environment automatically.
#     # env:
#     #   COORDINARE_INFERENCE_PROVIDER:       "${COORDINARE_INFERENCE_PROVIDER}"
#     #   COORDINARE_INFERENCE_MODEL:          "${COORDINARE_INFERENCE_MODEL}"
#     #   COORDINARE_INFERENCE_BASE_URL:       "${COORDINARE_INFERENCE_BASE_URL}"
#     #   COORDINARE_INFERENCE_API_KEY:        "${COORDINARE_INFERENCE_API_KEY}"
#     #   COORDINARE_INFERENCE_MAX_TOKENS:     "${COORDINARE_INFERENCE_MAX_TOKENS}"
#     #   COORDINARE_INFERENCE_MAX_TOOL_CALLS: "${COORDINARE_INFERENCE_MAX_TOOL_CALLS}"
#     #   COORDINARE_INFERENCE_AGENT_VERSION:  "${COORDINARE_INFERENCE_AGENT_VERSION}"

# --- Reviewers ---

human_reviewers:                    # Required. GitHub logins who can approve PRs.
  - "your-github-login"

# Bot reviewers whose comments trigger the performer lifecycle (same as human reviews).
# trusted_bot_reviewers:
#   - "copilot-pull-request-reviewer[bot]"

# --- Performer Lifecycle ---
# Configures which AI roles run and their backends/models.
#
# Canonical role order (earlier roles run first):
#   assessor → architect → implementer → reviewer → security → qa → tech_writer → closer
#
# The `default` entry supplies baseline values inherited by every configured role.
# Role-level fields that are explicitly set override the default; unset fields
# fall back to the default. This means you can set backend/model once and only
# specify exceptions.
#
# Omitting a role skips it entirely from the lifecycle.
#
# Role descriptions:
#   assessor    — evaluates whether the card spec is sufficiently clear to implement
#   architect   — designs the solution and produces a technical plan
#   implementer — writes the code
#   reviewer    — reviews for correctness and test coverage
#   security    — audits for vulnerabilities
#   qa          — validates acceptance criteria; writes missing tests
#   tech_writer — updates docs and changelogs
#   closer      — verifies all prior feedback was addressed; resolves open review threads
#   advocate    — answers inbound GitHub issues from external users (separate from lifecycle)
#
# Available backends: codex | claude_code | opencode | opencode_compat | junie | hermes
#   codex            — OpenAI Codex CLI; needs OPENAI_API_KEY in coordinare environment
#   claude_code      — Anthropic Claude Code CLI; needs ANTHROPIC_API_KEY in coordinare environment
#   opencode         — OpenCode CLI; reads API keys from ~/.opencode/config.json in the container
#   opencode_compat  — LCD /v1/chat/completions profile for self-hosted endpoints (LM Studio,
#                      vLLM, Ollama, LiteLLM); see specs/067-compatibility-first-backend/quickstart.md
#   junie       — JetBrains Junie CLI; reads auth from ~/.junie/ (mount via volumes, see above)
#   hermes      — Hermes coding agent; non-interactive `hermes chat` CLI with isolated job-scoped
#                 profile. Communication/scheduling toolsets are forbidden; only coding tools are
#                 enabled. See specs/068-hermes-backend/quickstart.md.
# effort values:      low | medium | high
# temperature:        0.0 (deterministic) – 1.0 (creative); None = backend default
# max_tokens:         cap output tokens; 0 = unlimited (overrides any inherited default)
# max_concurrency:    how many parallel instances of this role; default 1

# --- 080: model catalogs ---------------------------------------------------
# Declare WHERE models are served (endpoints), WHICH model lives where
# (model_endpoints), and HOW a role runs (modes), then point each performer at
# a mode by name. `kind` splits native vendor clouds (openai/anthropic — the
# harness uses its own client, no base_url, no proxy) from self-hosted
# (litellm/ollama/vllm — needs base_url, proxy-eligible). `strategy: single` is
# one model, no orchestration (today's behavior).
endpoints:
  - name: openai                    # native vendor cloud
    kind: openai
    auth_env: OPENAI_API_KEY

model_endpoints:
  - {name: gpt54,      endpoint: openai, model: gpt-5.4}
  - {name: gpt54-mini, endpoint: openai, model: gpt-5.4-mini}
  - {name: gpt55,      endpoint: openai, model: gpt-5.5}

modes:
  - {name: single-gpt54,      strategy: single, tool: gpt54}
  - {name: single-gpt54-mini, strategy: single, tool: gpt54-mini}
  - {name: single-gpt55,      strategy: single, tool: gpt55}

performers:
  default:
    backend: codex                  # inherited by all roles below unless overridden
    mode: single-gpt54              # 080: model selection via a mode reference
    effort: medium                  # "low" | "medium" | "high"
    temperature: 0.2                # 0.0–1.0
    max_tokens: 8192                # per-role output token cap; 0 = unlimited

  assessor:
    mode: single-gpt54-mini
    effort: low
    temperature: 0.0
    max_tokens: 2048
    # 166: run the assessor as a bounded role WORKFLOW (intake -> assess ->
    # gate -> report) instead of the single-prompt persona. The assessment is
    # a structured product reading (goal, expected behaviour, out-of-scope
    # items, questions, assumptions, criteria) that lives in coordinare state
    # and travels into the architect's intake. The clarification loop is bounded
    # by code: at most two questions, never re-asking an answered question, at
    # most two blocking rounds per card. Nothing is committed by the assessor
    # and no assessment.md file is written. Default off: remove the line to
    # restore the prose path exactly. See specs/166-assessor-workflow/quickstart.md.
    # workflow: assessor

  architect:
    effort: high
    max_tokens: 12288
    # 165: run the architect as a bounded role WORKFLOW (intake -> survey ->
    # blueprint -> size -> report) instead of the single-prompt persona. The
    # survey runs only read-only commands through an allow-list; the output is
    # one structured blueprint that coordinare slices into the implementer's,
    # documenter's and QA's briefs. Nothing is committed by the architect and
    # no plan.md/tasks.md is written. Default off: remove the line to restore
    # the prose path exactly. See specs/165-architect-blueprint-workflow/quickstart.md.
    # workflow: architect
    # workflow_env:
    #   ARCHITECT_SURVEY_MAX_COMMANDS: 12       # read-only commands the survey may run
    #   ARCHITECT_SURVEY_MAX_OUTPUT_CHARS: 4000 # per-command output cap

  implementer:
    effort: high
    # 167: run the implementer as a bounded test-first WORKFLOW instead of one
    # long harness run. Per blueprint milestone: a tests turn, an observed red
    # (the new tests fail, nothing regressed), an implementation turn, an
    # observed green, commits written by code. Then the repository's quality
    # commands, the 089 local gate, push, PR, and a wait for green CI with
    # bounded repair turns before pr_opened. Every loop has a cap. Default off:
    # remove the line to restore the prose path exactly, including the 075 CI
    # loop. See specs/167-implementer-tdd-workflow/quickstart.md.
    # NOTE: dispatcher_dedup.stall_timeout_seconds must be at least
    # IMPL_TURN_TIMEOUT_S, or the stall watchdog can kill a quiet harness turn;
    # the workflow forwards the harness's progress, but keep them consistent.
    # workflow: implementer
    # workflow_env:
    #   QUALITY_COMMANDS: |          # what CI enforces, one per line, run before push
    #     bundle exec rubocop
    #     bundle exec erb_lint --lint-all
    #   IMPL_TURN_TIMEOUT_S: 1200      # wall clock per harness turn
    #   IMPL_ATTEMPTS: 3               # implementation turns per milestone
    #   IMPL_QUALITY_REPAIRS: 2
    #   IMPL_CI_REPAIRS: 3
    #   IMPL_CI_WAIT_S: 1800           # pending checks past this are an env hold
    #   IMPL_DEFAULT_KIND: feature     # lane when no blueprint names a work kind
    max_tokens: 16384

  reviewer:
    effort: high
    temperature: 0.0
    # 169: run the review as a workflow: the injected diff parsed into changed
    # files, a read-only survey under the spec-165 allow-list, one schema-guarded
    # findings call, a gate that drops findings whose anchor does not verify
    # against the diff or the survey output, unaddressed prior comments and
    # implementer documentation edits added by rule, the verdict derived by code
    # (any finding is changes requested; approval needs every changed file
    # read), and exactly one GitHub review posted by the workflow. Findings are
    # lifted into the card and injected into the implementer, which repairs them
    # one file group at a time. Default off: remove the line to restore the
    # prose path exactly. See specs/169-reviewer-workflow/quickstart.md.
    # workflow: reviewer
    # workflow_env:
    #   REVIEWER_SURVEY_MAX_COMMANDS: 12       # read-only commands per survey turn
    #   REVIEWER_SURVEY_MAX_OUTPUT_CHARS: 4000 # kept per command
    #   REVIEWER_MAX_FINDINGS: 30              # hard cap, never above 30

  security:
    mode: single-gpt55              # upgrade model for security analysis if desired
    effort: high
    temperature: 0.0

  qa:
    effort: high
    temperature: 0.0
    max_tokens: 12288
    # 164: run QA as a multi-step workflow (plan -> boot -> baseline -> execute
    # -> observe -> judge -> report) instead of a single prompt. Opt-in; remove
    # the line to restore the single-prompt path exactly. See
    # specs/164-qa-role-workflow/quickstart.md.
    # workflow: qa
    # How the app under test boots. Layered over the env cache's activation env
    # (PORT, toolchain PATH, POSTGRESQL_*/REDIS_*); these values win. Needed
    # whenever infer_app_start_command cannot recognise the project (it knows
    # Rails, Django and Node only). Unquoted numbers are fine.
    # workflow_env:
    #   PORT: 3000
    #   QA_APP_START_COMMAND: "bin/rails s -b 127.0.0.1 -p 3000 -e test"
    #   QA_APP_SEED_COMMAND: "bin/rails db:migrate db:seed"   # runs BEFORE start
    #   QA_APP_BOOT_TIMEOUT: 180                               # seconds; default 60

  tech_writer:
    effort: medium
    max_tokens: 4096

  closer:
    mode: single-gpt54-mini
    effort: low
    temperature: 0.0
    max_tokens: 2048

# --- Self-hosted backend example (opencode_compat) ---
# Drop-in alternative for any role above. Add a self-hosted endpoint + model
# + mode to the catalogs, then point the role at it. The endpoint is an
# OpenAI-compatible /v1/chat/completions server (LM Studio, vLLM, Ollama, LiteLLM).
#
# endpoints:
#   - {name: lmstudio, kind: vllm, base_url: http://localhost:1234/v1}
# model_endpoints:
#   - {name: qwen-coder, endpoint: lmstudio, model: qwen3-coder-30b}
# modes:
#   - {name: single-qwen-coder, strategy: single, tool: qwen-coder}
# performers:
#   implementer:
#     backend: opencode_compat
#     mode: single-qwen-coder
#     temperature: 0.2
#     max_tokens: 8192
#     # Optional safety net for prompts that still emit `developer` role messages.
#     # Default true; flips to false to surface a hard error instead of remapping.
#     # See specs/067-compatibility-first-backend/research.md R4.
#     compat_remap_developer_role: true

# --- 078: self-hosted backend robustness layer (normalize / reroute / health-gate) ---
# A PERFORMER-scoped layer that sits in the performer's reverse-proxy seam and
# repairs the known failure shapes of self-hosted upstreams (LiteLLM/Ollama/vLLM):
# harmony/reasoning leaks instead of structured tool_calls, lossy proxies, wedged
# or unreachable runners. It activates ONLY when a `(backend, model)` pair resolves
# to a routing-table entry; for every other pair it is a byte-for-byte no-op
# (native vendor-cloud path is never touched).
#
# Two pieces wire it up:
#
#   1. A routing-table YAML file (schema below), authored separately and made
#      available inside the performer container (baked into the image or mounted
#      via this endpoint's `volumes:`).
#   2. The env var SELFHOSTED_ROUTING_CONFIG, pointing at that file's in-container
#      path. Empty / unset (the default) = no entries = layer disabled everywhere.
#      A non-empty path that is missing or malformed FAILS FAST at job start rather
#      than black-holing a card mid-lifecycle.
#
# Forward the env var into the performer the same way as any other (see the
# env-bootstrap performer above): list it under the endpoint's `env:` dict so
# ${VAR} expansion injects it — it is NOT inherited from the coordinare environment
# automatically. Example performer endpoint that mounts a baked routing table and
# enables the layer:
#
# performer_endpoints:
#   - id: selfhosted-robust
#     mode: ephemeral
#     roles: [implementer]
#     image: coordinare-performer:full
#     volumes:
#       # VolumeMount is a structured mapping (host_path/container_path/mode),
#       # NOT Docker's "host:container:ro" string form — extra="forbid" rejects
#       # the string. container_path must match SELFHOSTED_ROUTING_CONFIG below.
#       - host_path: "${SELFHOSTED_ROUTING_CONFIG_HOST}"
#         container_path: /etc/coordinare/routing.yaml
#         mode: ro
#     env:
#       SELFHOSTED_ROUTING_CONFIG: "/etc/coordinare/routing.yaml"
#
# Routing-table YAML schema (the file SELFHOSTED_ROUTING_CONFIG points at).
# Top-level `selfhosted_routing:` is a list of entries keyed by (backend, model);
# a pair with no matching entry is left untouched (native no-op). Validated by the
# spec-078 pydantic models at job start. Full contract:
# specs/078-selfhosted-backend-shim/contracts/routing-table.md
#
# selfhosted_routing:
#   - backend: openclaw
#     model: gpt-oss:120b
#     target:
#       base_url: http://localhost:11434/v1     # Ollama-direct clean upstream
#       wire_format: openai                 # openai | anthropic
#       strategy: reroute                   # bypass the lossy proxy entirely
#       reroute_upstream: null              # already the clean path
#   - backend: codex
#     model: gpt-oss:120b
#     target:
#       base_url: http://litellm:4000/v1
#       wire_format: openai
#       strategy: normalize                 # repair the response in-flight
#       normalizers: [harmony_tool_calls]   # explicit; only these run, in order
#       reroute_upstream: http://localhost:11434/v1   # health-gate auto-reroute on probe failure
#   - backend: claude_code
#     model: qwen3-coder
#     target:
#       base_url: http://litellm:4000
#       wire_format: anthropic
#       strategy: normalize
#       normalizers: [strip_reasoning]
#       reroute_upstream: null
#
# Validation rules enforced at load (fail fast, not at runtime):
#   - strategy: reroute   ⇒ normalizers MUST be empty/absent.
#   - strategy: normalize ⇒ normalizers non-empty; every key MUST exist in the
#                           performer's NORMALIZER_REGISTRY.
#   - missing base_url, or wire_format not in {openai, anthropic} → load error.
#   - reroute_upstream, when set, is the auto-reroute fallback the startup health
#     probe uses when the primary target is unhealthy (else it fails closed —
#     the card is not accepted, never black-holed).

# --- Hermes backend example ---
# Hermes is invoked non-interactively via the `hermes chat` CLI. Each job runs in
# an isolated profile directory the adapter creates and removes; the operator's
# personal ~/.hermes is never read or written. Messaging / gateway / cron /
# clarify / shared user-memory toolsets are forbidden by construction.
#
# performers:
#   implementer:
#     backend: hermes
#     model: qwen3-coder-30b           # forwarded to hermes via HERMES_MODEL
#     temperature: 0.2
#     max_tokens: 8192
#
# Required environment variables (forwarded into the performer job):
#   HERMES_PROVIDER  — model provider name Hermes understands (e.g. "openai_compat")
#   HERMES_API_KEY   — credential for the provider; redacted from adapter logs
#   HERMES_MODEL     — default model id; per-role `model:` overrides this at dispatch
# Optional:
#   HERMES_BASE_URL  — endpoint for OpenAI-compatible / self-hosted providers
# Adapter-managed (do NOT set):
#   HERMES_HOME      — the adapter creates a job-scoped temp directory and unconditionally
#                      removes it on every terminal outcome (done / error / stop / timeout).
#                      Any operator-provided HERMES_HOME is intentionally ignored.

# --- Personas ---
# Customise per-role AI prompts. Omitted roles use built-in defaults.
# Max 8000 characters per instructions string.
#
# personas:
#   implementer:
#     instructions: "Always write tests first. Follow our coding standards."
#   reviewer:
#     instructions: "Focus on correctness, security, and test coverage."
#   qa:
#     instructions: "Run the full test suite and write tests for every uncovered path."

# --- Card Selection ---

# Only consider cards assigned to this GitHub login. Omit to process all cards.
# The filter governs every card coordinare adopts, not only new pickups: a card
# someone else owns is left alone in In progress, In review and Blocked too.
# Work already in flight is unaffected -- unassigning a card coordinare is
# already working does not abandon it mid-branch.
# assignee_filter: "coordinare-bot"

# Also adopt cards with NO assignee at all. Eligibility is the union of the two
# opt-ins: a card assigned to somebody else is in neither. Set on its own (no
# assignee_filter) this means "unassigned only" -- work what nobody has claimed,
# leave what a human has claimed, so assigning a card to yourself takes it off
# coordinare. That is the setting for a deployment authenticating as a GitHub
# App, which has no assignable login of its own: an App cannot be assigned to an
# issue. Usually set per symphony.
# include_unassigned: false

# Priority-aware card selection from the TODO column.
# priority:
#   field_name: "Priority"          # name of the GitHub Project V2 custom field
#   priority_order: ["P0", "P1", "P2", "P3"]  # highest-to-lowest priority values

# --- Concurrency ---

# Maximum cards worked in parallel across all symphonies (or per symphony via overrides).
# Sessions passively awaiting human review do not count toward this limit.
# Range: 1–20. Default: 1.
max_concurrent_cards: 1

# Maximum reviewer → implementer feedback cycles before blocking for human review.
# Each "changes requested" that routes back to the implementer counts as one cycle.
# Set 0 to disable (not recommended — a flaky reviewer can loop indefinitely).
# Range: 0–50. Default: 5.
max_feedback_cycles: 5

# --- PR Lifecycle Guards ---

# Block fresh implementer dispatches after this many closed (unmerged) PRs for an issue.
# Set 0 to disable.
max_closed_pr_attempts_per_issue: 3

# How coordinare handles a branch that collides with an existing remote branch.
#   delete — delete the existing branch and recreate (default)
#   suffix — append a short unique suffix to the new branch name
branch_collision_strategy: "delete"   # "delete" | "suffix"

# Whether to delete stale feature branches after merging.
stale_branch_cleanup: true

# What to do when card requirements change while a performer is in flight.
#   ignore      — continue with original requirements
#   warn        — log a warning and notify, but continue
#   re-dispatch — abort current lifecycle and re-dispatch with updated requirements (default: warn)
requirement_change_policy: "warn"   # "ignore" | "warn" | "re-dispatch"

# --- CI Gate & Baseline-Repair Autonomy (specs 075 / 090 / 095) ---
#
# All of these live under a symphony's `persona_scope:` and default OFF — the
# pre-feature behaviour is unchanged until an operator opts in per symphony.
#
# persona_scope:
#   ci_gate:                         # 075: evaluate required checks at the
#     enabled: true                  #   implementer→reviewer boundary; bounce the
#     max_bounces_per_head: 3        #   performer up to N times per head SHA.
#   baseline_prevention_gate:        # 090 L1: refuse to merge onto a red base.
#     enabled: true
#   baseline_classification_gate:    # 090 L2: classify each failing check as
#     enabled: true                  #   inherited / introduced / flake / unknown
#                                    #   (observe-only; no routing influence).
#   inherited_repair_gate:           # 090 L3: bounded autonomous repair of an
#     enabled: true                  #   INHERITED failure behind the test-integrity
#     max_repair_attempts_per_head: 1#   guard (never auto-merges; still needs a human).
#
#   # 095: ENV_BLOCKED — infrastructure/environment failures no code change can
#   # fix (artifact-storage quota, offline runner, billing/spending limit). When
#   # ON, a required failing check whose normalized reason matches an infra
#   # signature HOLDs the card (no bounce, no re-dispatch) and surfaces a DISTINCT
#   # operator notification (cause + action), deduped once per (head, pattern).
#   # When the signature clears on a later run, coordinare auto-resumes. Built-in
#   # patterns (artifact_storage_quota, runner_offline, billing_limit) always
#   # apply; `patterns` only ADDS operator-defined ones. Fail-safe: an
#   # unrecognized failure is never labeled ENV_BLOCKED. Route the `env_blocked`
#   # notification event to a channel (see Notifications) so operators see it.
#   env_blocked_gate:
#     enabled: true
#     patterns:                      # optional — extend the built-ins
#       - id: registry_outage        #   stable identifier (used in dedup + logs)
#         regex: "registry.*unavailable|pull access denied"   # vs normalized reason
#         cause: "Container registry unavailable"             # operator-facing
#         action: "Check registry status / credentials"       # what to do

# --- Conducting Backend (spec 062) ---
# Coordinare's "internal brain" — what the coordinare uses on the podium to
# interpret cards and make routing decisions.  Runs one-shot prompts only:
# card sufficiency assessment (assess_card) and ad-hoc reasoning calls.
# Distinct from the ``assessor`` performer (which executes a separate,
# heavier code-review role).
#
# Mirrors the performer config surface — pick a backend, optionally pin a
# model, and tune max_tokens / temperature.
#
# Backends:
#   anthropic_api — direct Anthropic SDK call (requires ANTHROPIC_API_KEY)
#   openai_api    — OpenAI-compatible Chat Completions (requires OPENAI_API_KEY)
#   claude_cli    — subprocess `claude --print "..."` using local CLI auth
#   codex_cli     — subprocess `codex exec -` (shares the codex performer's auth)
#   opencode      — opencode CLI
#   none          — skip assessment; all cards assumed sufficient
#
# Examples:
#   # Use codex (shares the codex performer's auth / model)
#   conducting:
#     backend: "codex_cli"
#     model: "gpt-5.5"
#     max_tokens: 4096
#     temperature: 0.0
#     effort: "low"   # low | medium | high
#
#   # Use OpenAI API directly
#   conducting:
#     backend: "openai_api"
#     model: "gpt-4o-mini"
#     max_tokens: 4096
#     temperature: 0.0
#     effort: "low"   # low | medium | high
#     # base_url: "https://api.openai.com/v1"   # override for Azure / proxies
#
# CLI backends (claude_cli / codex_cli / opencode) accept an optional
# ``executable:`` to point at a non-default binary path.
#
# ``effort:`` (low / medium / high) controls reasoning budget for backends
# that expose it: openai_api (reasoning_effort), codex_cli
# (model_reasoning_effort), and opencode (--effort).  No-op for
# anthropic_api / claude_cli (extended thinking is not enabled here).
# Defaults to "low" — the conducting brain runs short one-shot prompts where
# extra reasoning budget is mostly waste.
conducting:
  backend: "anthropic_api"
  model: "claude-sonnet-4-20250514"
  max_tokens: 4096
  temperature: 0.0
  effort: "low"

# --- Workspace ---
# Root directory for performer workspaces (cloned repos). Defaults to system temp dir.
# workspace_root: "/var/coordinare/workspaces"

# --- Performer Environment Caching (spec 060) ---
# Host directory under which per-symphony dev-environment cache subdirectories are created.
# Each enabled symphony gets its own subdirectory: <env_cache_root>/<sanitised-name>/
# The bootstrap performer writes tooling into this directory (read-write); all other
# performers receive it as a read-only mount at /devenv/<sanitised-name> inside the container.
# Defaults to ~/.coordinare/env-caches/ — set an explicit path if you need a specific location.
# env_cache_root: "~/.coordinare/env-caches"

# Git identity used for all performer commits.
# bot_identity:
#   name: "Coordinare Bot"
#   email: "coordinare@localhost"

# Environment variables passed through to performer subprocesses.
# env_passthrough: ["ANTHROPIC_API_KEY", "OPENAI_API_KEY", "DATABASE_URL"]

# --- Polling & Timing ---

poll_interval_seconds: 30               # how often to poll the board; range 0–3600
heartbeat_interval_seconds: 30          # internal liveness tick; range 5–300
blocked_reminder_hours: 24              # re-notify on blocked cards after this many hours

# --- Ports & Output ---

health_check_port: 8080                 # GET /health — liveness probe endpoint
dashboard_port: 8090                    # web dashboard; change if port is taken
dashboard_host: "127.0.0.1"             # bind address; use "0.0.0.0" to expose externally
output_mode: "human"                    # "human" (readable logs) | "structured" (JSON)
log_level: "info"                       # "debug" | "info" | "warning" | "error"

# --- Webhooks (optional, replaces polling) ---
# webhooks:
#   enabled: false
#   path: "/webhook/github"             # endpoint path on the health server
#   secret: "${GITHUB_WEBHOOK_SECRET}"  # HMAC secret configured in GitHub

# --- Cost Tracking ---
# cost_tracking:
#   cost_per_million_tokens: 3.0        # dollars per million tokens; used for estimates
#   cost_budget_per_card: null          # alert when a card exceeds this dollar budget; null = no limit

# --- Stuck Card Alerts ---
# stuck_alerts:
#   threshold_seconds: 1800             # alert when a card is stuck for this long; 0 = disabled
#   cooldown_seconds: 1800              # minimum interval between repeated stuck alerts
#   quiet_threshold_seconds: 300        # 138: silence before the dashboard activity feed marks
#                                       #   a card quiet; 0 = disabled. Keep below the smallest
#                                       #   stuck threshold — this is the only "not moving"
#                                       #   signal that fires on a stock install, because the
#                                       #   stall watchdog ships disabled and the monitoring-
#                                       #   phase stuck threshold is a full hour.
#   per_phase_thresholds:               # per-phase overrides (take precedence over threshold_seconds)
#     monitoring_performer: 3600        # 60 min — codex sessions routinely run 30–40 min
#     monitoring_agent: 3600

# --- Health-Check Retry ---
# health_check:
#   max_attempts: 3                     # total attempts when waiting for a performer to become ready; range 1–10
#   backoff_seconds: 1.0                # base backoff in seconds; doubles each attempt

# --- Resilience (circuit breakers & retries) ---
# Fine-tune retry/circuit-breaker behaviour per service. Defaults shown.
#
# resilience:
#   github_retry:
#     attempts: 5                       # total attempts; range 1–10
#     wait_initial_seconds: 3.0         # initial backoff; range 0.1–60
#     wait_max_seconds: 30.0            # max backoff cap; range 1–300
#     wait_jitter_seconds: 2.0          # random jitter added to each wait
#     wait_exp_base: 1.618              # exponential base (golden ratio); range 1–5
#   github_circuit:
#     failure_threshold: 5              # consecutive failures before opening; range 1–20
#     recovery_window_seconds: 180.0    # how long to stay open before half-open probe
#     observation_window_seconds: 300.0 # window over which failures are counted
#
#   # Same structure for: slack_retry, smtp_retry, anthropic_retry, agent_retry
#   #                     slack_circuit, smtp_circuit, anthropic_circuit, agent_circuit

# --- Customer Advocate (optional, spec 007) ---
# Monitors inbound GitHub issues and auto-responds to non-engineering requests.
#
# advocate:
#   enabled: false
#   github_repo: "your-org/your-repo"   # required when enabled
#   confidence_threshold: 0.70          # 0.0–1.0; above this threshold, auto-respond
#   handled_label: "advocate-handled"   # label applied to handled issues
#   escalation_label: "needs-human"     # label applied when escalating
#   doc_sources: ["README.md"]          # repo files to use as context for responses
#   doc_branch: "HEAD"                  # branch to fetch doc_sources from
#   sensitive_keywords:                 # issues mentioning these are always escalated
#     - billing
#     - payment
#     - legal
#     - security breach
#   support_channel_url: "https://example.com/support"

# --- Notifications ---
notifications:
  history_max_age_hours: 24             # how long to retain notification history in memory
  prolonged_idle_threshold_seconds: 1800  # fire prolonged_idle event after this many seconds with no activity

  # Notifications ship OFF by default so a freshly copied config validates without
  # any Slack webhook or SMTP credentials. To enable delivery, replace the empty
  # lists below with (copies of) the commented reference channels/routing that follow.
  channels: []
  routing: []

  # --- Reference: Slack + email channels (uncomment and set secrets to enable) ---
  # channels:
  #   - name: slack-ops
  #     type: slack                       # "slack" | "email"
  #     webhook_url: "${COORDINARE_SLACK_WEBHOOK_URL}"  # incoming webhook URL from Slack app settings
  #     rate_limit: 10                    # max messages per rate_window_seconds; 0 = unlimited
  #     rate_window_seconds: 60
  #     dedup_window_seconds: 600         # suppress duplicate messages within this window; 0 = off
  #     retry_count: 5                    # delivery retry attempts; range 1–10
  #     retry_delay_seconds: 2.0          # seconds between retries
  #     message_template: "{summary}"     # template vars: {event_type} {source} {summary} {detail}
  #
  #   - name: email-team
  #     type: email
  #     # Mailgun SMTP example — confirmed working with port 587 + STARTTLS.
  #     # For Mailgun EU use "smtp.eu.mailgun.org". smtp_username must be the full
  #     # SMTP credential email created in the Mailgun dashboard.
  #     smtp_host: "smtp.mailgun.org"
  #     smtp_port: 587                    # 587 (STARTTLS) | 465 (SSL) | 25 (plain)
  #     smtp_username: "postmaster@mail.example.com"
  #     smtp_password: "${COORDINARE_SMTP_PASSWORD}"
  #     smtp_recipient: "team@example.com"
  #     # smtp_sender: "coordinare@your-domain.example"   # From address; set this to your own domain
  #     # subject_template: "{event_type}: {source}"  # email subject; defaults to message_template
  #     rate_limit: 5
  #     rate_window_seconds: 300
  #     dedup_window_seconds: 3600
  #     retry_count: 3
  #     retry_delay_seconds: 5.0
  #
  # routing:
  #   # Available event types:
  #   #   card_transition     — card moved to a new phase
  #   #   card_dispatched     — performer started on a card
  #   #   card_blocked        — card is blocked (dependency or repeated failure)
  #   #   card_stuck          — card has remained in the same phase too long (028)
  #   #   card_merged         — PR was squash-merged
  #   #   advocate_escalation — advocate escalated an issue to a human
  #   #   daemon_restart      — coordinare process restarted
  #   #   circuit_breaker_trip — a circuit breaker opened (service outage detected)
  #   #   prolonged_idle      — coordinare has been idle for prolonged_idle_threshold_seconds
  #   #   env_blocked         — 095: an infra/environment CI block (artifact-storage
  #   #                         quota, offline runner, billing limit) no code change
  #   #                         can fix. ROUTE THIS if env_blocked_gate is enabled —
  #   #                         it is the operator's signal to act. (A ci_gate.
  #   #                         env_blocked_hold WARNING log also fires regardless.)
  #   - event_type: card_transition
  #     channels: [slack-ops]
  #   - event_type: card_dispatched
  #     channels: [slack-ops]
  #   - event_type: card_blocked
  #     channels: [slack-ops, email-team]
  #   - event_type: card_stuck
  #     channels: [slack-ops]
  #   - event_type: card_merged
  #     channels: [slack-ops]
  #   - event_type: advocate_escalation
  #     channels: [slack-ops, email-team]
  #   - event_type: daemon_restart
  #     channels: [slack-ops]
  #   - event_type: circuit_breaker_trip
  #     channels: [slack-ops, email-team]
  #   - event_type: prolonged_idle
  #     channels: [email-team]
  #   - event_type: env_blocked        # 095: infra/environment block — operator must act
  #     channels: [slack-ops, email-team]
  #   - event_type: card_auto_recovered  # 129: a BLOCKED card auto-unblocked (blocker cleared)
  #     channels: [slack-ops]


# --- Symphonies ---
# Each entry is a separate GitHub Project board to orchestrate.
# Coordinare runs symphonies in the order listed.
#
# Required per entry: name (alphanumeric + dash), github_project_number.
# name appears in logs, dashboard, and branch names.
# enabled: false pauses a symphony without removing it.
#
# Per-symphony overrides merge with global config for that symphony only.
# Any global field (poll_interval_seconds, max_concurrent_cards, performers, etc.)
# can be overridden here. Per-symphony personas merge with (not replace) global personas.
symphonies:
  - name: backend
    github_project_number: 43
    # enabled: true                   # default; set false to pause without removing
    # env_bootstrap_performer_id: bootstrap-env   # enables env-caching for this symphony;
    #                                             # must match a performer_endpoints id above
    # env_spec_files: [README.md]     # files whose SHA change triggers a fresh bootstrap;
    #                                 # defaults to [README.md]; relative to repo root
    # overrides:
    #   max_concurrent_cards: 2       # range 1–20
    #   poll_interval_seconds: 60
    #   max_closed_pr_attempts_per_issue: 5
    #   assignee_filter: "backend-bot"
    #   include_unassigned: true      # also take cards nobody has claimed
    # personas:
    #   implementer:
    #     instructions: "Follow the backend coding standards in CONTRIBUTING.md."
    # --- 092: symphony test-environment injection (optional) ---
    # Names a dotenv-style file of KEY=VALUE pairs (e.g. POSTGRESQL_PASSWORD)
    # that coordinare injects into every context that runs project code: the
    # service-inference start-phase validation dry-run, the env-cache QA runtime
    # where services-start.sh runs, and code-running performers. Values are
    # parsed literally (no shell execution / interpolation) and treated as
    # secret-like — only var NAMES and the source PATH are ever logged/persisted.
    # Coordinare-owned operational secrets (GITHUB_TOKEN, API keys) are injected
    # AFTER these, so a test file can never clobber them.
    #
    # Supply EXACTLY ONE source (both-set or neither-set is a config error). Omit
    # the whole block to fall back to the inference agent's discovered path.
    # test_env:
    #   repo_path: .coordinare/test.env   # resolved INSIDE the cloned symphony repo
    #                                     # (repo-relative, containment-checked)
    #   # host_path: /home/youruser/secrets/backend-test.env  # absolute host path,
    #   #                                                       # read directly (mutually
    #   #                                                       # exclusive with repo_path)

  - name: frontend
    github_project_number: 44
    # overrides:
    #   poll_interval_seconds: 45
    #   performers:
    #     implementer:
    #       model: gpt-5.4
    #       max_tokens: 16384

  # Example: a temporarily paused symphony
  # - name: data-platform
  #   github_project_number: 55
  #   enabled: false


# --- Orchestra ---
# Controls how coordinare schedules work across symphonies.
#
# Modes:
#   shared_pool — all symphonies share the global max_concurrent_cards budget
#                 (the only mode currently implemented)
# 076 — Dispatcher dedup + reconciliation tunables (defaults from spec 076 Q1-Q5).
dispatcher_dedup:
  enabled: true
  reconciliation_budget_seconds: 30
  drain_budget_seconds: 5
  reap_budget_seconds: 5
  idle_timeout_retries: 2
  idle_timeout_window_hours: 24
  empty_output_retries: 1
  empty_output_window_hours: 24
  wedge_block_threshold: 3
  wedge_block_window_hours: 24
  multi_pr_check_triggers: [dispatch, restart, webhook]

orchestra:
  mode: shared_pool


# =============================================================================
# FORMAT B — Legacy Flat Configuration (single-project, backward compatible)
# =============================================================================
# Uncomment this block and remove everything above `symphonies:` to use the
# single-project format. Coordinare auto-detects the format by checking for
# the `symphonies:` key.

# project_name: "my-project"           # GitHub repo name (defaults to project dir name)
# github_org: "your-org"
# github_project_number: 1
# github_token: "${COORDINARE_GITHUB_TOKEN}"
#
# agent_transport: "subprocess"         # "subprocess" | "ssh" | "kubernetes"
# agent_executable: "bin/run-performer"
#
# human_reviewers:
#   - "your-github-login"
#
# trusted_bot_reviewers:
#   - "copilot-pull-request-reviewer[bot]"
#
# performers:
#   default:
#     backend: codex                    # "codex" | "opencode" | "claude_code"
#   implementer: {}                     # inherits all fields from default
#   reviewer: {}
#
# max_concurrent_cards: 1
# poll_interval_seconds: 30
# health_check_port: 8080
# dashboard_port: 8090
# output_mode: "human"                  # "human" | "structured"
# log_level: "info"                     # "debug" | "info" | "warning" | "error"
#
# notifications:
#   channels: []
#   routing: []
