# =============================================================================
# Coordinare Configuration Example
# =============================================================================
#
# Config Discovery (4-path search order, first match wins):
#   1. --config <path>              CLI flag (highest priority)
#   2. COORDINARE_CONFIG_PATH        Environment variable pointing to a file
#   3. ./config.yaml                Current working directory
#   4. ~/.coordinare/config.yaml     User home directory
#
# Environment Variable Overrides:
#   Any scalar field can be omitted from this file and supplied as an
#   environment variable instead: COORDINARE_<FIELD_NAME> (uppercase).
#   Examples:
#     COORDINARE_GITHUB_TOKEN=ghp_...
#     COORDINARE_POLL_INTERVAL_SECONDS=60
#     COORDINARE_LOG_LEVEL=debug
#
#   Note: List/nested fields (e.g. notifications.channels) must be defined
#   in the config file; they cannot be supplied via environment variables.
#
#   Coordinare starts successfully with NO config file if all required fields
#   are supplied via COORDINARE_* environment variables (useful for CI/CD).
#
# =============================================================================
# TWO SUPPORTED FORMATS
# =============================================================================
#
# FORMAT A — Multi-Symphony (spec 057, recommended for multi-project setups):
#   Global settings live at the root level. Projects are declared under
#   `symphonies:`, each with their own name and github_project_number.
#   Per-symphony `overrides:` can override any global field for that project.
#   Format is detected automatically by the presence of a non-empty `symphonies:` list
#   (`symphonies: []` is treated as legacy fallback per FR-001).
#
# FORMAT B — Legacy Flat (still supported, single-project):
#   All fields (including project_name and github_project_number) at the root.
#   No `symphonies:` or `orchestra:` keys.
#   (See the legacy example at the bottom of this file.)
#
# Required global fields: github_org, github_token or github_auth:app,
#                         human_reviewers
# Required per-symphony:  name, github_project_number
# project_name note:      project_name identifies the GitHub repo used for REST
#                         operations (branch checks, PR queries, and git clone).
#                         Each symphony gets its own WorkspaceManager seeded from
#                         its effective config. project_name defaults to the symphony
#                         name when not set, so if your repo name matches the symphony
#                         name no explicit value is needed. If they differ, set it
#                         globally or per-symphony: overrides: {project_name: my-repo}.
# =============================================================================


# =============================================================================
# FORMAT A — Multi-Symphony Configuration (spec 057)
# =============================================================================

# --- Global settings (shared across all symphonies) ---

github_org: "your-org"

# --- Authentication ---
# Option A: Personal Access Token (PAT)
# github_token: "${COORDINARE_GITHUB_TOKEN}"

# Option B: GitHub App (recommended for production)
# github_auth: app
# github_app_id: 12345
# github_private_key_path: /path/to/private-key.pem
# github_installation_id: 67890

# --- Agent Transport ---
agent_transport: "subprocess"
agent_executable: "/usr/local/bin/performer"
# transport_timeout_seconds: 30  # default

# --- Reviewers ---
human_reviewers:
  - "your-github-login"

# Trusted bot reviewers whose feedback triggers the performer lifecycle
# (same as human reviews — implementer will address their comments)
trusted_bot_reviewers:
  - "copilot-pull-request-reviewer[bot]"

# --- Performer Lifecycle ---
# Configure which roles run and their AI backends.
# Roles execute in canonical order: assessor → architect → implementer →
# reviewer → security → qa → tech_writer → closer.
# Unconfigured roles are skipped. With no performers section, coordinare
# falls back to implementer-only mode (backward compatible).
#
# The closer is the closing-review pass: after all other roles have run,
# it verifies that prior PR feedback (from earlier reviewers, Copilot, or
# humans) was actually addressed by subsequent commits, then resolves all
# open review threads so the PR can clear merge gates that require
# "all conversations resolved" (a common ruleset requirement).
#
# Available backends: codex, opencode, claude_code
performers:
  assessor:
    backend: codex
  architect:
    backend: codex
  implementer:
    backend: codex
  reviewer:
    backend: codex
  security:
    backend: codex
  qa:
    backend: codex
  tech_writer:
    backend: codex
  closer:
    backend: codex

# Guardrail: stop opening fresh PRs after too many closed attempts for one issue.
# Counts only CLOSED (unmerged) linked PRs. Set 0 to disable.
max_closed_pr_attempts_per_issue: 3

# --- Persona Instructions (018) ---
# Customise per-role AI prompts. Omitted roles use built-in defaults.
#
# personas:
#   implementer:
#     instructions: "Always write tests first."
#   reviewer:
#     instructions: "Focus on correctness and test coverage."

# --- Polling & Health ---
poll_interval_seconds: 30
heartbeat_interval_seconds: 30
health_check_port: 8080
dashboard_port: 8090  # default; change if another service holds this port
output_mode: "human"   # "human" or "structured" (JSON)
log_level: "info"

# --- Notifications ---
notifications:
  history_max_age_hours: 24
  prolonged_idle_threshold_seconds: 1800

  channels:
    - name: slack-ops
      type: slack
      webhook_url: "${COORDINARE_SLACK_WEBHOOK_URL}"
      rate_limit: 10
      rate_window_seconds: 60
      dedup_window_seconds: 600
      retry_count: 5
      retry_delay_seconds: 2
      message_template: "{summary}"

    - name: email-team
      type: email
      # Mailgun SMTP example — confirmed working with port 587 + STARTTLS.
      # For Mailgun EU use "smtp.eu.mailgun.org".  Username must be the full
      # SMTP credential email (e.g. postmaster@mail.yourdomain.com) created
      # in the Mailgun dashboard under "SMTP credentials".
      smtp_host: "smtp.mailgun.org"
      smtp_port: 587
      smtp_username: "postmaster@mail.example.com"
      smtp_password: "${COORDINARE_SMTP_PASSWORD}"
      smtp_recipient: "team@example.com"
      rate_limit: 5
      rate_window_seconds: 300
      dedup_window_seconds: 3600
      retry_count: 3
      retry_delay_seconds: 5

  routing:
    - event_type: card_transition
      channels: [slack-ops]
    - event_type: card_dispatched
      channels: [slack-ops]
    - event_type: card_blocked
      channels: [slack-ops, email-team]
    - event_type: card_merged
      channels: [slack-ops]
    - event_type: advocate_escalation
      channels: [slack-ops, email-team]
    - event_type: daemon_restart
      channels: [slack-ops]
    - event_type: circuit_breaker_trip
      channels: [slack-ops, email-team]
    - event_type: prolonged_idle
      channels: [email-team]


# --- Symphonies (spec 057) ---
# Each entry is a separate GitHub project board to orchestrate.
# Required: name (alphanumeric + dash), github_project_number.
# name becomes the project identifier in logs and the dashboard.
# Orchestration runs each enabled symphony in priority order (list order).
symphonies:
  - name: backend
    github_project_number: 43
    # enabled: true  # default; set false to pause without removing

    # Per-symphony overrides — any global field can be overridden here.
    # overrides:
    #   poll_interval_seconds: 60
    #   max_closed_pr_attempts_per_issue: 5

    # Per-symphony personas — merged with global personas.
    # personas:
    #   implementer:
    #     instructions: "Follow the backend coding standards doc."

  - name: frontend
    github_project_number: 44
    # overrides:
    #   poll_interval_seconds: 45

  # Example: a temporarily paused symphony
  # - name: data-platform
  #   github_project_number: 55
  #   enabled: false


# --- Orchestra (spec 057) ---
# Controls how coordinare schedules work across symphonies.
orchestra:
  mode: shared_pool


# =============================================================================
# FORMAT B — Legacy Flat Configuration (single-project, backward compatible)
# =============================================================================
# Uncomment this block and remove everything above `symphonies:` to use the
# single-project format. Coordinare auto-detects the format by checking for
# the `symphonies:` key.

# project_name: "my-project"
# github_org: "your-org"
# github_project_number: 1
#
# # github_token: "${COORDINARE_GITHUB_TOKEN}"
