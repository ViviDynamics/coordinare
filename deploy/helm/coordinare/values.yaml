# Values for the coordinare chart.
#
# Nothing in this file is a secret. Credentials reach the daemon through a
# Secret; the configuration references environment-variable *names* only. This
# file is the thing you commit to git.

# --- The controller ---------------------------------------------------------

# Coordinare supports EXACTLY ONE replica. Its state is a single-process JSON
# snapshot on one volume; a second replica races on that file and corrupts it.
# Any other value fails the render, with the reason, unless you set the override
# below. This is a correctness constraint, not a performance default.
replicaCount: 1

# Set true only if you have read the above and accept that state may be lost.
# The name is the warning.
allowUnsafeMultiReplica: false

image:
  repository: ghcr.io/vividynamics/coordinare-daemon
  # Pinned on purpose. A floating tag means a Pod reschedule can silently change
  # the running version, which is not something you want to discover from
  # behaviour. Defaults to the chart's appVersion.
  tag: ""
  # Always, not IfNotPresent: the release tag is mutable (Main Branch Build
  # re-pushes the same tag when it re-releases that HEAD), and IfNotPresent
  # then resolves against the node cache, so a pod restart can silently serve
  # the pre-push digest. The release flow depends on every start re-resolving
  # the tag. See issue #518.
  pullPolicy: Always
  # Optional content pin: when set, the rendered image is repository@digest
  # and the tag is ignored, so every pod of this deployment runs a
  # bit-identical image for its lifetime. Main Branch Build prints the digest
  # of the daemon image it pushes to the job summary of its build-daemon job.
  # Leave empty for the tag+Always default above.
  # Example: digest: "sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
  digest: ""

imagePullSecrets: []

# Additional containers to run alongside coordinare in the same Pod.
#
# They share the Pod's network namespace, so coordinare reaches them on
# 127.0.0.1 — which is what makes this useful rather than decorative. Coordinare
# refuses a plain-http GitHub or model URL for any host other than loopback, so
# a proxy or gateway it should talk to over http has to be a sidecar rather than
# a separate Service. The integration tests use this to run a GitHub stub the
# daemon can resolve its project against.
#
# Rendered verbatim as Kubernetes container specs — including any volumeMounts
# they declare. A sidecar that mounts the `state` volume can read and modify
# coordinare.state.json, which holds session state, board cards, PR metadata and
# decision history. That is inherent to running a container in the same Pod, not
# something the chart can prevent, so treat anything you add here as being as
# trusted as coordinare itself.
extraContainers: []
#  - name: model-proxy
#    image: ghcr.io/example/proxy:1.2.3
#    ports:
#      - containerPort: 4000

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # The controller KEEPS its ServiceAccount token: it manages performer Pods
  # through the Kubernetes API and cannot work without one. Performer Pods are
  # the opposite case and suppress theirs (spec 146), because they run
  # AI-generated code.
  name: ""

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

# --- State ------------------------------------------------------------------

# The controller's durable state. Created from the StatefulSet's
# volumeClaimTemplate, one claim per replica, named state-<release>-0. It is
# ReadWriteOnce and only the controller writes it. It holds:
#   - coordinare.state.json: the snapshot. Sessions, board cards, PR metadata,
#     retry counters and decision history. This is the one you cannot lose.
#   - env-cache bookkeeping under <mountPath>/env-caches (env_cache_root). The
#     daemon's side of the performer environment cache: the rendered scripts
#     and manifests. The toolchains themselves live on devenvCache, not here.
#   - run transcripts and run logs under <mountPath>/transcripts and
#     <mountPath>/run-logs. Both are on by default and both grow with work done.
#     Retention is set in config (transcripts.retention_days, run_logs).
state:
  # Required. Unlike the performer cache below, the controller cannot run
  # without somewhere durable to keep its snapshot. 8Gi holds the snapshot
  # comfortably; transcripts and run logs are what fill it. Size up for a busy
  # board, and watch `du -sh /var/lib/coordinare/*` from inside the Pod.
  size: 8Gi
  # Leave empty to use the cluster's default StorageClass. Name one explicitly
  # if your cluster has storage but no default (common on minikube/microk8s).
  # This claim is ReadWriteOnce, so any class that provides RWO works here.
  storageClass: ""
  # Where the claim is mounted in the controller Pod. The snapshot path,
  # env_cache_root and the transcript and run-log directories are all derived
  # from this, so change it in one place only.
  mountPath: /var/lib/coordinare

# --- Performer environment cache --------------------------------------------

# The performer environment cache: the toolchains a symphony's performers need
# (rbenv and gems, node modules, debs), installed once by the bootstrap
# performer and then mounted read-only into every consumer performer. Each
# symphony gets its own subdirectory on the claim, named with the sanitised
# symphony name (sanitise_symphony_name in coordinare's env_cache service).
# Each performer Pod mounts only its symphony's subdirectory, at
# /devenv/<sanitised-name>. For a symphony called "Dettmore Platform" that is
# subPath `dettmore-platform-4b278e` on the claim, mounted at
# /devenv/dettmore-platform-4b278e inside the Pod.
#
# The chart creates it by default in the performer namespace. The default needs
# a StorageClass that supports ReadWriteMany. Without one the claim stays
# Pending and the bootstrap and performers wait. See the README, "Persistent
# state". Coordinare's daemon reads the claim name from config
# (kubernetes_cache_claim). The chart sets it from the values below, so do not
# set it in config while the chart wires a claim.
devenvCache:
  # Turn this off to run performers with a cold cache. Every dispatch then
  # repeats the environment bootstrap, which is slow but not broken. Use this
  # on a cluster with no ReadWriteMany StorageClass (for example kind, which
  # defaults to RWO-only local-path), or on a small cluster where you do not
  # want a 50Gi claim. Turning it off is a supported choice, not a fault.
  enabled: true

  # TRI-STATE. Leave it null (the default) and the chart decides for you:
  #   - null, and no claim named below: the chart CREATES the claim.
  #   - null, and an existingClaim or performers.cacheClaim is named: the chart
  #     WIRES that existing claim. This is how an install that predates
  #     devenvCache keeps working unchanged.
  #   - true: the chart creates the claim named `name`. Explicit true together
  #     with an existing claim is a render failure, because the two disagree.
  #   - false: the chart wires an existing claim, and `existingClaim` is then
  #     required.
  # Helm cannot tell an unset value from a default of true, which is why the
  # default is null and not true.
  #
  # A created claim is annotated helm.sh/resource-policy: keep, and a claim that
  # already exists and is not owned by this release makes `helm install` refuse.
  # That refusal is deliberate, so name the claim with existingClaim rather than
  # letting Helm adopt one it did not create.
  create: null

  # The name of an existing claim to wire in. It must be in the performer
  # namespace, because a PersistentVolumeClaim is namespaced and performer Pods
  # can only mount a claim from their own namespace. Setting it with create
  # explicitly true fails the render (the two disagree).
  existingClaim: ""

  # The name the chart gives the claim it creates. Also what the daemon mounts.
  name: coordinare-devenv-cache

  # The performer namespace the claim lives in. Leave empty to use
  # performers.namespace, which itself defaults to this release's namespace.
  # If you set it, it must equal performers.namespace: performer Pods mount
  # claims from their own namespace only, and the chart fails otherwise.
  # The chart does not create the namespace. Create it first when it is not
  # the release namespace:  kubectl create namespace coordinare-performers
  namespace: ""

  # Leave empty to use the cluster's default StorageClass. Name one explicitly
  # if the default is RWO-only, or if your cluster has several classes and only
  # one of them does RWX. Choose a class that supports ReadWriteMany, such as
  # NFS, CephFS, EFS, Azure Files or Longhorn with RWX enabled. A class that does
  # not will leave the claim Pending, or bind it to a single node that the
  # other performers cannot reach.
  storageClassName: ""

  # Sizing: one claim holds every symphony's toolchain. Measure one symphony
  # after a successful bootstrap with `du -sh /devenv/<sanitised-name>` (from a
  # performer Pod, or on the NFS export), then multiply by the number of
  # symphonies you run, and leave headroom for upgrades. 50Gi is a starting
  # point, not a recommendation. A claim that fills up fails bootstraps
  # mid-install, which is much harder to diagnose than a claim that is too small.
  # Expansion is only possible if the StorageClass allows volume expansion.
  size: 50Gi

  # Requested access modes. Keep ReadWriteMany. The bootstrap performer writes
  # the cache while consumer performers mount it read-only, and those can run
  # on different nodes at the same time. A ReadWriteOnce claim binds to one
  # node, so performers scheduled anywhere else stay Pending. Changing this
  # after the claim exists is refused by Kubernetes, so get it right first.
  accessModes:
    - ReadWriteMany

# --- Performers -------------------------------------------------------------

performers:
  # Where performer Pods are created. Defaults to this release's namespace, so
  # Pods do not scatter into an unrelated one. devenvCache.namespace, when set,
  # must match this value.
  namespace: ""

  # DEPRECATED, but still supported. The name of an existing devenv claim, from
  # before devenvCache existed. An install that sets only this keeps working
  # unchanged: it is wired in as devenvCache.existingClaim, no PVC is rendered,
  # and NOTES.txt prints the migration. To migrate, set devenvCache.create to
  # false and devenvCache.existingClaim to the same name, then clear this key.
  # It fails the render only when it contradicts an explicit devenvCache setting.
  cacheClaim: ""

  # Registry credentials for the performer image, if your registry needs them.
  imagePullSecrets: []

  # Known residual risk, accepted for now (issue #524): the performer image
  # (coordinare-performer:extra|full, set per symphony in config.yaml) resolves
  # from the node cache with IfNotPresent, deliberately — a 4 GB pull per
  # dispatch would make performers cold for minutes (FR-013). A re-pushed
  # performer tag can therefore be picked up only on a node that lacks the
  # cached image, and stale digests persist until the node re-images. The
  # digest pinning above covers the daemon only; pinning the performer image
  # at dispatch time is a follow-up.

  # Restrict what performer Pods can reach. OFF by default, deliberately.
  #
  # PROVE YOUR CLUSTER ENFORCES THIS BEFORE RELYING ON IT:
  #
  #     coordinare doctor --check egress
  #
  # A NetworkPolicy does nothing unless the CNI implements it, and support is
  # often PARTIAL rather than absent — kind's kindnet enforces ingress but not
  # egress, which was measured rather than assumed. Turning this on where it is
  # not enforced gives you no protection while looking as though it does, which
  # is worse than leaving it off.
  #
  # CIDRs, not hostnames. A NetworkPolicy cannot express "allow api.github.com":
  # `egress.to` accepts only ipBlock and selectors. The Docker path's allowlist IS
  # hostname-based, so these are not equivalent and should not be treated as such.
  # For hostname-level control you need a CNI with FQDN policies, or an egress
  # proxy.
  egress:
    enabled: false
    # Where kube-dns lives. DNS is always permitted; without it nothing resolves.
    dnsNamespace: kube-system
    # Everything else a performer may reach, as CIDRs.
    allowedCIDRs: []
    #  - 140.82.112.0/20   # github.com
    #  - 10.0.0.0/8        # your internal model gateway

# --- Dashboard --------------------------------------------------------------

dashboard:
  port: 8090

  service:
    # ClusterIP only. Nothing is reachable from outside the cluster by default.
    type: ClusterIP

  # EXTRA trusted hostnames, beyond the ones the chart adds for you.
  #
  # A dashboard token is required via COORDINARE_DASHBOARD_AUTH_TOKEN in the
  # configured Secret. Spec 144 also refuses any request whose Host header is
  # not loopback, and leaves this list empty by default so the safe posture is
  # what you get by doing nothing.
  #
  # This chart adds three entries automatically -- the Service's own DNS name and
  # the short forms Kubernetes resolves it by -- because otherwise the Service it
  # ships would return 403 on every request. That is a real widening of a control
  # that was deliberately opt-in, which is why it is written here rather than
  # hidden in a template.
  #
  # Add only exact hostnames. A wildcard hands the guard away entirely.
  trustedHosts: []

  ingress:
    # Off by default. Configure TLS and optionally SSO at the proxy before
    # publishing the dashboard. Token holders have full operator privileges.
    enabled: false
    className: ""
    annotations: {}
    hosts: []
    tls: []

# --- MCP management server ---------------------------------------------------

mcp:
  # The MCP management server (spec 551) as a sidecar container: the same
  # daemon image running `python -m coordinare.mcp`, proxying the dashboard
  # REST API for external AI agents. Off by default.
  #
  # Enabling it requires COORDINARE_MCP_TOKEN (the agent-facing bearer) AND
  # COORDINARE_MCP_DASHBOARD_TOKEN (what the sidecar presents to the
  # dashboard; set it to the same value as the daemon's own
  # COORDINARE_DASHBOARD_AUTH_TOKEN). Both arrive via the configured Secret,
  # which envFrom injects into the sidecar. Two different tokens: one per
  # trust boundary, so an escaped agent token is not a dashboard token.
  enabled: false
  port: 8091

# --- Health -----------------------------------------------------------------

health:
  port: 8080

metrics:
  # /metrics discloses card counts, model identifiers and error rates to anyone
  # who can reach the port. Off by default.
  expose: false

# --- Credentials ------------------------------------------------------------

# Name of a Secret you manage yourself (External Secrets, Vault, sealed-secrets).
# When set, the chart creates no Secret of its own.
existingSecret: ""

# Credentials for the chart to put in a Secret it creates. Prefer existingSecret
# above for anything you would not want in a values file.
secrets: {}
#  GITHUB_TOKEN: ghp_...
#  OPENAI_API_KEY: sk-...

# A GitHub App private key is a FILE, not an environment variable, so it is
# mounted from a Secret rather than injected. Name the Secret and its key here.
githubAppPrivateKey:
  existingSecret: ""
  key: private-key.pem
  mountPath: /etc/coordinare/github-app

# --- Coordinare configuration ------------------------------------------------

# Merged into the rendered config.yaml. Put your board, endpoints and roles here.
# Reference credentials as ${ENV_VAR_NAME} -- coordinare expands them at load time
# from the environment the Secret supplies. Never put a credential value here.
config: {}
