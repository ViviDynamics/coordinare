# Values for the coordinare chart.
#
# Nothing in this file is a secret. Credentials reach the daemon through a
# Secret; the configuration references environment-variable *names* only. This
# file is the thing you commit to git.

# --- The controller ---------------------------------------------------------

# Coordinare supports EXACTLY ONE replica. Its state is a single-process JSON
# snapshot on one volume; a second replica races on that file and corrupts it.
# Any other value fails the render, with the reason, unless you set the override
# below. This is a correctness constraint, not a performance default.
replicaCount: 1

# Set true only if you have read the above and accept that state may be lost.
# The name is the warning.
allowUnsafeMultiReplica: false

image:
  repository: ghcr.io/vividynamics/coordinare-daemon
  # Pinned on purpose. A floating tag means a Pod reschedule can silently change
  # the running version, which is not something you want to discover from
  # behaviour. Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Additional containers to run alongside coordinare in the same Pod.
#
# They share the Pod's network namespace, so coordinare reaches them on
# 127.0.0.1 — which is what makes this useful rather than decorative. Coordinare
# refuses a plain-http GitHub or model URL for any host other than loopback, so
# a proxy or gateway it should talk to over http has to be a sidecar rather than
# a separate Service. The integration tests use this to run a GitHub stub the
# daemon can resolve its project against.
#
# Rendered verbatim as Kubernetes container specs — including any volumeMounts
# they declare. A sidecar that mounts the `state` volume can read and modify
# coordinare.state.json, which holds session state, board cards, PR metadata and
# decision history. That is inherent to running a container in the same Pod, not
# something the chart can prevent, so treat anything you add here as being as
# trusted as coordinare itself.
extraContainers: []
#  - name: model-proxy
#    image: ghcr.io/example/proxy:1.2.3
#    ports:
#      - containerPort: 4000

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # The controller KEEPS its ServiceAccount token: it manages performer Pods
  # through the Kubernetes API and cannot work without one. Performer Pods are
  # the opposite case and suppress theirs (spec 146), because they run
  # AI-generated code.
  name: ""

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

# --- State ------------------------------------------------------------------

state:
  # Required. Unlike the performer cache below, the controller cannot run
  # without somewhere durable to keep its snapshot.
  size: 8Gi
  # Leave empty to use the cluster's default StorageClass. Name one explicitly
  # if your cluster has storage but no default — common on minikube/microk8s.
  storageClass: ""
  mountPath: /var/lib/coordinare

# --- Performers -------------------------------------------------------------

performers:
  # Where performer Pods are created. Defaults to this release's namespace, so
  # Pods do not scatter into an unrelated one.
  namespace: ""

  # Optional ON PURPOSE. An environment cache makes performers faster; its
  # absence makes them cold, not broken. Requiring it would fail to install on
  # exactly the small clusters this is meant to support.
  cacheClaim: ""

  # Registry credentials for the performer image, if your registry needs them.
  imagePullSecrets: []

  # Restrict what performer Pods can reach. OFF by default, deliberately.
  #
  # PROVE YOUR CLUSTER ENFORCES THIS BEFORE RELYING ON IT:
  #
  #     coordinare doctor --check egress
  #
  # A NetworkPolicy does nothing unless the CNI implements it, and support is
  # often PARTIAL rather than absent — kind's kindnet enforces ingress but not
  # egress, which was measured rather than assumed. Turning this on where it is
  # not enforced gives you no protection while looking as though it does, which
  # is worse than leaving it off.
  #
  # CIDRs, not hostnames. A NetworkPolicy cannot express "allow api.github.com":
  # `egress.to` accepts only ipBlock and selectors. The Docker path's allowlist IS
  # hostname-based, so these are not equivalent and should not be treated as such.
  # For hostname-level control you need a CNI with FQDN policies, or an egress
  # proxy.
  egress:
    enabled: false
    # Where kube-dns lives. DNS is always permitted; without it nothing resolves.
    dnsNamespace: kube-system
    # Everything else a performer may reach, as CIDRs.
    allowedCIDRs: []
    #  - 140.82.112.0/20   # github.com
    #  - 10.0.0.0/8        # your internal model gateway

# --- Dashboard --------------------------------------------------------------

dashboard:
  port: 8090

  service:
    # ClusterIP only. Nothing is reachable from outside the cluster by default.
    type: ClusterIP

  # EXTRA trusted hostnames, beyond the ones the chart adds for you.
  #
  # A dashboard token is required via COORDINARE_DASHBOARD_AUTH_TOKEN in the
  # configured Secret. Spec 144 also refuses any request whose Host header is
  # not loopback, and leaves this list empty by default so the safe posture is
  # what you get by doing nothing.
  #
  # This chart adds three entries automatically -- the Service's own DNS name and
  # the short forms Kubernetes resolves it by -- because otherwise the Service it
  # ships would return 403 on every request. That is a real widening of a control
  # that was deliberately opt-in, which is why it is written here rather than
  # hidden in a template.
  #
  # Add only exact hostnames. A wildcard hands the guard away entirely.
  trustedHosts: []

  ingress:
    # Off by default. Configure TLS and optionally SSO at the proxy before
    # publishing the dashboard. Token holders have full operator privileges.
    enabled: false
    className: ""
    annotations: {}
    hosts: []
    tls: []

# --- Health -----------------------------------------------------------------

health:
  port: 8080

metrics:
  # /metrics discloses card counts, model identifiers and error rates to anyone
  # who can reach the port. Off by default.
  expose: false

# --- Credentials ------------------------------------------------------------

# Name of a Secret you manage yourself (External Secrets, Vault, sealed-secrets).
# When set, the chart creates no Secret of its own.
existingSecret: ""

# Credentials for the chart to put in a Secret it creates. Prefer existingSecret
# above for anything you would not want in a values file.
secrets: {}
#  GITHUB_TOKEN: ghp_...
#  OPENAI_API_KEY: sk-...

# A GitHub App private key is a FILE, not an environment variable, so it is
# mounted from a Secret rather than injected. Name the Secret and its key here.
githubAppPrivateKey:
  existingSecret: ""
  key: private-key.pem
  mountPath: /etc/coordinare/github-app

# --- Coordinare configuration ------------------------------------------------

# Merged into the rendered config.yaml. Put your board, endpoints and roles here.
# Reference credentials as ${ENV_VAR_NAME} -- coordinare expands them at load time
# from the environment the Secret supplies. Never put a credential value here.
config: {}
