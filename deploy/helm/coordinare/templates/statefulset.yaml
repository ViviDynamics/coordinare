{{- include "coordinare.checkReplicas" . -}}
{{/*
The controller.

A StatefulSet rather than a Deployment for two reasons that both matter:
the volumeClaimTemplate binds state to the workload's identity, so an upgrade
keeps it and a reschedule reattaches the same volume; and OrderedReady
terminates the old Pod before starting the new one, where a Deployment's rolling
update would briefly run two. Two coordinare processes on one state file is the
corruption this chart exists to prevent.
*/}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "coordinare.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "coordinare.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  serviceName: {{ include "coordinare.fullname" . }}
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      {{- include "coordinare.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "coordinare.labels" . | nindent 8 }}
      annotations:
        # Hash only config data: the seed includes the chart-owned boot overlay.
        # Resource labels and names must not trigger a config restart.
        checksum/config: {{ (include (print $.Template.BasePath "/configmap.yaml") . | fromYaml).data | toYaml | sha256sum }}
    spec:
      # Budget: 5s preStop + 22s HTTP (20s drain + 2s overhead) + 12s runtime
      # (5s conductor flush + 5s snapshot + 2s overhead) + 1s watchdog
      # + 2s event store = 42s; 45s leaves 3s.
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      serviceAccountName: {{ include "coordinare.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if (dig "enabled" true (.Values.configPersistence | default dict)) }}
      initContainers:
        - name: seed-config
          {{- if .Values.image.digest }}
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          {{- else }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command: ["/app/.venv/bin/python", "-m", "coordinare.services.config_seed"]
          args: ["/etc/coordinare/config.yaml", "{{ .Values.state.mountPath | trimSuffix "/" }}/config/config.yaml"]
          volumeMounts:
            - name: config
              mountPath: /etc/coordinare
              readOnly: true
            - name: state
              mountPath: {{ .Values.state.mountPath }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- end }}
      containers:
        - name: coordinare
          {{- if .Values.image.digest }}
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          {{- else }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- if (dig "enabled" true (.Values.configPersistence | default dict)) }}
          args: ["--config", "{{ .Values.state.mountPath | trimSuffix "/" }}/config/config.yaml"]
          {{- else }}
          args: ["--config", "/etc/coordinare/config.yaml"]
          {{- end }}
          ports:
            - name: dashboard
              containerPort: {{ .Values.dashboard.port }}
            - name: health
              containerPort: {{ .Values.health.port }}
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret | default (include "coordinare.fullname" .) }}
                optional: true
          env:
            {{- if (dig "enabled" true (.Values.configPersistence | default dict)) }}
            - name: COORDINARE_CONFIG_SEED
              value: /etc/coordinare/config.yaml
            {{- end }}
            {{- if .Values.observability.otlp.headersSecret.name }}
            - name: OTEL_EXPORTER_OTLP_HEADERS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.observability.otlp.headersSecret.name | quote }}
                  key: {{ required "observability.otlp.headersSecret.key is required" .Values.observability.otlp.headersSecret.key | quote }}
            {{- end }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          lifecycle:
            preStop:
              exec:
                # Keep serving while ingress and EndpointSlices observe pod termination.
                command: ["/bin/sleep", "5"]
          livenessProbe:
            httpGet:
              path: /live
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              # Route the shell during daemon startup; daemon readiness stays at health /ready.
              path: /dashboard/ready
              port: dashboard
            initialDelaySeconds: 0
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 2
            successThreshold: 1
          volumeMounts:
            - name: config
              mountPath: /etc/coordinare
              readOnly: true
            - name: state
              mountPath: {{ .Values.state.mountPath }}
            {{- if .Values.githubAppPrivateKey.existingSecret }}
            - name: github-app-key
              mountPath: {{ .Values.githubAppPrivateKey.mountPath }}
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
        {{- if .Values.mcp.enabled }}
        # The MCP management server (spec 551): env-driven, so it needs no
        # config.yaml — only the bearer tokens, which arrive via the same
        # secretRef the main container uses. It talks to the dashboard over
        # loopback inside the Pod, never across the network.
        - name: mcp
          {{- if .Values.image.digest }}
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          {{- else }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command: ["/app/.venv/bin/python", "-m", "coordinare.mcp"]
          ports:
            - name: mcp
              containerPort: {{ .Values.mcp.port }}
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret | default (include "coordinare.fullname" .) }}
                optional: true
          env:
            - name: COORDINARE_MCP_PORT
              value: {{ .Values.mcp.port | quote }}
            - name: COORDINARE_MCP_DASHBOARD_URL
              value: "http://localhost:{{ .Values.dashboard.port }}"
            - name: COORDINARE_MCP_HEALTH_URL
              value: "http://localhost:{{ .Values.health.port }}"
        {{- end }}
        {{- with .Values.extraContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "coordinare.fullname" . }}
        {{- if .Values.githubAppPrivateKey.existingSecret }}
        # A private key is a file, not an environment variable. Projecting it as
        # one would mean writing it to disk at runtime.
        - name: github-app-key
          secret:
            secretName: {{ .Values.githubAppPrivateKey.existingSecret }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: state
        labels:
          {{- include "coordinare.stableLabels" . | nindent 10 }}
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.state.storageClass }}
        storageClassName: {{ .Values.state.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.state.size }}
