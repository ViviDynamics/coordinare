# =============================================================================
# Coordinare Configuration Example — Codex Backend (OpenAI)
# =============================================================================
#
# Minimal config for running performers on the OpenAI Codex CLI. See
# config.example.yaml for the full reference.
#
# How Codex runs under coordinare:
#   - The performer invokes the `codex` CLI per card.
#   - Authentication: OPENAI_API_KEY is forwarded automatically from the
#     coordinare host environment into each job. No volumes required.
#   - Image: build `coordinare-performer:full` from agent/performer/Dockerfile.
# =============================================================================


# --- GitHub ---

github_org: "your-org"
github_token: "${COORDINARE_GITHUB_TOKEN}"
github_auth: "pat"

human_reviewers:
  - "your-github-handle"


# --- Symphonies ---

symphonies:
  - name: my-project
    github_project_number: 1


# --- Containerized Performer (Codex) ---
#
# OPENAI_API_KEY must be exported in the coordinare host environment;
# coordinare injects it into the job payload automatically.

performer_endpoints:
  - id: codex-ephemeral
    mode: ephemeral
    roles:
      - assessor
      - architect
      - implementer
      - reviewer
      - security
      - qa
      - tech_writer
      - closer
    image: coordinare-performer:full
    # service_inference (env_bootstrap role only) — provider seam for the
    # bootstrap agent's LLM-driven service discovery (commit 8eefef3).
    # Default provider is `anthropic` (needs ANTHROPIC_API_KEY). For a
    # codex/OpenAI setup, set PROVIDER=openai_compat with BASE_URL /
    # API_KEY / MODEL so service_inference uses the same endpoint as the
    # rest of your performers.
    # env:
    #   COORDINARE_INFERENCE_PROVIDER:       "${COORDINARE_INFERENCE_PROVIDER}"
    #   COORDINARE_INFERENCE_MODEL:          "${COORDINARE_INFERENCE_MODEL}"
    #   COORDINARE_INFERENCE_BASE_URL:       "${COORDINARE_INFERENCE_BASE_URL}"
    #   COORDINARE_INFERENCE_API_KEY:        "${COORDINARE_INFERENCE_API_KEY}"
    #   COORDINARE_INFERENCE_MAX_TOKENS:     "${COORDINARE_INFERENCE_MAX_TOKENS}"
    #   COORDINARE_INFERENCE_MAX_TOOL_CALLS: "${COORDINARE_INFERENCE_MAX_TOOL_CALLS}"
    #   COORDINARE_INFERENCE_AGENT_VERSION:  "${COORDINARE_INFERENCE_AGENT_VERSION}"


# --- Performers ---

# --- 080: model catalogs (declare once, reference per performer by `mode`) ---
endpoints:
  - {name: openai-cloud, kind: openai, auth_env: OPENAI_API_KEY}
model_endpoints:
  - {name: gpt-5-4, endpoint: openai-cloud, model: gpt-5.4}
  - {name: gpt-5-4-mini, endpoint: openai-cloud, model: gpt-5.4-mini}
  - {name: gpt-5-5, endpoint: openai-cloud, model: gpt-5.5}
modes:
  - {name: single-gpt-5-4, strategy: single, tool: gpt-5-4}
  - {name: single-gpt-5-4-mini, strategy: single, tool: gpt-5-4-mini}
  - {name: single-gpt-5-5, strategy: single, tool: gpt-5-5}

performers:
  default:
    backend: codex
    mode: single-gpt-5-4
    effort: medium
    temperature: 0.2
    max_tokens: 8192

  assessor:
    mode: single-gpt-5-4-mini
    effort: low
    temperature: 0.0
    max_tokens: 2048

  architect:
    effort: high
    max_tokens: 12288

  implementer:
    effort: high
    max_tokens: 16384

  reviewer:
    effort: high
    temperature: 0.0

  security:
    mode: single-gpt-5-5
    effort: high
    temperature: 0.0

  qa:
    effort: high
    temperature: 0.0
    max_tokens: 12288

  closer:
    mode: single-gpt-5-4-mini
    effort: low
    temperature: 0.0
    max_tokens: 2048

# 076 — Dispatcher dedup + reconciliation tunables (defaults from spec 076 Q1-Q5).
dispatcher_dedup:
  enabled: true
  reconciliation_budget_seconds: 30
  drain_budget_seconds: 5
  reap_budget_seconds: 5
  idle_timeout_retries: 2
  idle_timeout_window_hours: 24
  empty_output_retries: 1
  empty_output_window_hours: 24
  wedge_block_threshold: 3
  wedge_block_window_hours: 24
  multi_pr_check_triggers: [dispatch, restart, webhook]
