# Responds to pull requests opened from outside the ViviDynamics organization
# with coordinare's contribution policy (see CONTRIBUTING.md), then labels and
# closes them. Spec 142 / issue #196, FR-011 through FR-013 and FR-025.
#
# WHY pull_request_target AND NOT pull_request
# -------------------------------------------
# A fork-originated `pull_request` event runs with a read-only GITHUB_TOKEN and
# no access to secrets, so a job triggered that way physically cannot comment,
# label, or close. `pull_request_target` runs in the base-repository context with
# a write token, which is what this job needs.
#
# THE RULE THAT MAKES THAT SAFE
# -----------------------------
# NEVER add `actions/checkout` to this workflow, and never run anything from the
# pull request. `pull_request_target` holds a write token in the base context;
# checking out untrusted head code under it is the well-known privilege
# escalation. This job reads three event fields and makes three API calls. It
# touches nothing from the fork.
#
# Untrusted text (the pull request title and body) is read inside
# github-script from `context.payload` and is NEVER interpolated through
# `${{ }}`, which would be a shell/script injection vector independent of the
# checkout issue.
#
# Runner: GitHub-hosted on purpose. Every other workflow here targets
# self-hosted runners, which is the wrong choice for an externally triggered job
# that should not interact with our runner hosts at all. If GitHub-hosted
# minutes ever become unavailable, this job is API-only and would remain safe on
# a self-hosted runner, but only for as long as that stays true.

name: External Contributions

on:
  pull_request_target:
    types:
      - opened
      - reopened

concurrency:
  group: external-contributions-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  pull-requests: write

jobs:
  policy-response:
    name: Apply contribution policy
    runs-on: ubuntu-latest
    # Cheap pre-filter so insider and bot pull requests do not even start a job.
    # The authoritative classification is re-derived in the step below; this is
    # here to keep the Actions log quiet for first-party work, not to be the
    # security boundary.
    if: >-
      github.event.pull_request.user.type != 'Bot' &&
      github.event.pull_request.author_association != 'OWNER' &&
      github.event.pull_request.author_association != 'MEMBER' &&
      github.event.pull_request.author_association != 'COLLABORATOR'
    steps:
      - name: Comment, label, and close if the author is external
        # SHA-pinned rather than tag-pinned, unlike the other workflows here.
        # This is the one job that holds a write token AND is triggered by an
        # outside party, so a repointed tag would be a live path to abusing that
        # token. f28e40c is actions/github-script v7.1.0 (resolved 2026-08-27).
        # When bumping, resolve the new tag to its commit and update both.
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const pr = context.payload.pull_request;

            // GitHub computes author_association and user.type. Neither can be
            // set by the author, which is why classification is trustworthy.
            // Note CONTRIBUTOR is treated as external: it means "has landed a
            // commit before", which under a closed-contribution policy should
            // not describe an outsider, but if it ever does the policy applies.
            const INTERNAL = ['OWNER', 'MEMBER', 'COLLABORATOR'];
            const isInternal = INTERNAL.includes(pr.author_association);
            const isBot = pr.user && pr.user.type === 'Bot';

            if (isInternal || isBot) {
              core.info(
                `Skipping: author_association=${pr.author_association} type=${pr.user && pr.user.type}`
              );
              return;
            }

            // Security carve-out (FR-025). This match runs over
            // author-controlled text, which is acceptable ONLY because its sole
            // power is to SUPPRESS automation and escalate to a human. A false
            // positive costs one manual close. A false negative auto-closes a
            // vulnerability report, which is the outcome being prevented.
            const SECURITY_PATTERN =
              /\b(security|vulnerabilit\w*|CVE-\d|exploit\w*|RCE|XSS|CSRF|SSRF|injection|credential\w*|secret\s+leak|token\s+leak)\b/i;
            const haystack = `${pr.title || ''}\n${pr.body || ''}`;
            const is_security = SECURITY_PATTERN.test(haystack);

            const policy = [
              'Thanks for taking the time to open this. Quick heads up from an automation:',
              '',
              "Coordinare doesn't accept public pull requests, so this one won't be merged. That's not a",
              'comment on your code. Coordinare is an autonomous agent system that holds GitHub write',
              'credentials and executes AI-generated code, so we keep the supply chain closed and do all',
              'implementation inside the organization. See',
              '[CONTRIBUTING.md](https://github.com/ViviDynamics/coordinare/blob/main/CONTRIBUTING.md)',
              'for the full reasoning.',
              '',
              '**Your work is still wanted.** If you found a bug, please',
              '[open an issue](https://github.com/ViviDynamics/coordinare/issues/new/choose) and describe the',
              'fix, or paste the diff into the issue body. We will implement it and credit you.',
            ];

            if (is_security) {
              policy.push(
                '',
                '---',
                '',
                'This looks like it might touch on security, so we are **leaving it open** for a human to',
                'read rather than closing it automatically. If it concerns a vulnerability, please also',
                'report it privately via',
                '[a security advisory](https://github.com/ViviDynamics/coordinare/security/advisories/new),',
                'since a public pull request discloses the issue to everyone.'
              );
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: policy.join('\n'),
            });

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              labels: ['external-contribution'],
            });

            if (is_security) {
              core.notice(
                'Security-related external pull request: commented and labelled, left open for human review.'
              );
              return;
            }

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              state: 'closed',
            });
