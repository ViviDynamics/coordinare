name: Sync Version to Open PRs

# Fires after a release is published (i.e. after main-branch-build tags a release).
# At that point the new tag already exists in the remote, so validate-version on
# each PR branch correctly detects version conflicts and we can bump past them.
#
# Note: commits pushed here use GITHUB_TOKEN, which by design does NOT re-trigger
# workflows on the PR branches. Developers will see the updated version file on
# their next git pull; PR CI re-runs naturally on their next push.
on:
  release:
    types: [published]

jobs:
  sync:
    name: Bump version on open PR branches
    runs-on:
      - self-hosted
      - linux
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch all tags
        run: git fetch --tags

      - name: Bump version on each open PR branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_BRANCHES=$(gh pr list --state open --limit 1000 --json headRefName --jq '.[].headRefName')

          if [ -z "$PR_BRANCHES" ]; then
            echo "No open PRs — nothing to sync"
            exit 0
          fi

          echo "Release ${{ github.event.release.tag_name }} published. Syncing open PRs..."

          for branch in $PR_BRANCHES; do
            echo ""
            echo "--- $branch ---"

            git fetch origin "$branch"
            git checkout "$branch"

            # Skip branches that don't have the versioning scripts yet
            if [ ! -f bin/validate-version ] || [ ! -f bin/update-version ]; then
              echo "Skipping: versioning scripts not present on $branch"
              git checkout main
              continue
            fi

            # Skip if already valid (version is newer than all existing tags)
            if python3 bin/validate-version 2>/dev/null; then
              echo "Already valid — skipping"
              git checkout main
              continue
            fi

            # Loop until valid: on busy days the same-day tag counter may be
            # several ahead of the current version, so a fixed 2-attempt cap
            # is not enough. 10 attempts covers any realistic release cadence.
            bumped=false
            for attempt in $(seq 1 10); do
              python3 bin/update-version
              if python3 bin/validate-version 2>/dev/null; then
                bumped=true
                break
              fi
            done

            if [ "$bumped" = "false" ]; then
              echo "WARNING: could not find a valid version for $branch after 10 bumps — skipping"
              git checkout version  # discard any partial changes
              git checkout main
              continue
            fi

            git add version
            if git diff --cached --quiet; then
              echo "No change after bump (unexpected) — skipping"
            else
              git commit -m "[ci] Bump version to $(cat version) after release ${{ github.event.release.tag_name }}"
              # Push may be rejected if the developer pushed concurrently.
              # That's fine — pr-ci's validate-version job will bump on their next push.
              if git push origin "$branch"; then
                echo "Updated $branch → $(cat version)"
              else
                echo "WARNING: push rejected for $branch (concurrent push likely) — PR CI will bump on next push"
                git reset --hard HEAD~1
              fi
            fi

            git checkout main
          done
