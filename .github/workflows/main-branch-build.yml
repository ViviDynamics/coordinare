name: Main Branch Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: main-branch-build
  cancel-in-progress: false

jobs:
  derive-version:
    timeout-minutes: 10
    name: Derive Version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.derive.outputs.version }}
      sha: ${{ steps.derive.outputs.sha }}
    steps:
      - name: Assert main branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "ERROR: This workflow must only run on main (got $GITHUB_REF). Aborting to prevent releasing unmerged code."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags --force

      # Derive the release version from the tags that already exist, rather than
      # reading a file committed on the branch.
      #
      # The file-based approach is what produced the stranded-PR-head problem:
      # a CalVer string stored in the repo goes stale on every branch, so PR CI
      # had to bump and push it, and a GITHUB_TOKEN push does not re-trigger CI,
      # leaving the PR head with zero checks and a BLOCKED state that looks like
      # a failure. Deriving here removes the need for any branch to hold a
      # correct version, so nothing can be stale and nothing needs bumping.
      #
      # Mirrors the org release.yml. See issue #215.
      - name: Derive CalVer version from existing tags
        id: derive
        shell: bash
        run: |
          set -euo pipefail

          # 159: YYYY.M.N, the scheme other in-house projects already mint, so every repo
          # in the org versions the same way. It is valid SemVer, which the old
          # YYYY.MM.DD[.N] was not (four components, zero-padded month) -- and that
          # is what lets the chart below be published at this exact string instead
          # of a mapping of it.
          #
          # Reuse a tag already pointing at HEAD rather than minting a second one
          # for the same commit: re-running this workflow must be idempotent. Both
          # shapes are accepted here, because the pre-159 tags are real releases
          # whose images are published under those names.
          existing="$(git tag --points-at HEAD | grep -E '^v?[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,2}(\.[0-9]+)?$' | head -n 1 || true)"
          if [ -n "$existing" ]; then
            echo "Reusing existing tag on HEAD: $existing"
            version="${existing#v}"
          else
            # The counter ignores the legacy four-component tags: 2026.09.01.3
            # parsed loosely offers a patch of 01, and the next mint would collide
            # with a tag that is already pushed. See tests/unit/test_159_calver.py.
            version="$(python3 .github/scripts/next_calver.py)"
            echo "Derived new version: $version"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  lint:
    timeout-minutes: 10
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Run Ruff
        run: uv run --extra dev ruff check src tests agent/performer/src

      - name: Ruff baseline (432 ratchet)
        run: uv run --extra dev python scripts/ruff_baseline.py

      - name: Typecheck (433 ratchet)
        run: uv run --extra dev mypy -p coordinare

  test:
    timeout-minutes: 20
    name: Test (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # 289: four parallel shards; scripts/ci_shard.py puts every test file in exactly one.
    # tests/e2e holds only browser tests, which the E2E lane runs, so these shards skip it.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Install coordinare and performer packages
        run: |
          uv venv
          uv pip install -e ".[dev]"
          uv pip install -e "agent/performer[dev]"

      - name: Run pytest
        # The list is captured first: inside a command argument a failed
        # $(...) would leave pytest with no paths, and it would run everything.
        run: |
          files=$(python scripts/ci_shard.py --shard ${{ matrix.shard }} --of 4 tests --exclude tests/e2e)
          uv run --extra dev pytest --junitxml=junit-test-${{ matrix.shard }}.xml $files

      - name: Verify OTLP wire protocols and licences
        if: ${{ matrix.shard == 1 }}
        run: |
          uv sync --extra otlp --extra dev --inexact
          uv run --no-sync python -c "import grpc; import google.protobuf; import opentelemetry.proto.collector.logs.v1.logs_service_pb2"
          uv run --no-sync pytest tests/unit/test_271_otlp_wire.py tests/unit/test_142_license_and_legal_posture.py -v

      - name: Upload test timings
        # 289: scripts/ci_durations.py turns these into tests/ci-durations.json to rebalance shards.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-${{ matrix.shard }}
          path: junit-test-${{ matrix.shard }}.xml
          retention-days: 14

  coverage-shard:
    timeout-minutes: 25
    name: Coverage (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # 289: each shard records partial data; the Coverage job combines it and applies the floor.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Install coordinare and performer packages
        run: |
          uv venv
          uv pip install -e ".[dev]"
          uv pip install -e "agent/performer[dev]"

      - name: Run coverage shard
        env:
          COVERAGE_FILE: .coverage.shard${{ matrix.shard }}
        # The 90% floor applies to the combined data only, so a shard reports without failing on it.
        # The list is captured first: inside a command argument a failed
        # $(...) would leave pytest with no paths, and it would run everything.
        run: |
          files=$(python scripts/ci_shard.py --shard ${{ matrix.shard }} --of 4 tests --exclude tests/e2e)
          uv run --extra dev pytest --cov=coordinare --cov-report= --cov-fail-under=0 $files

      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-${{ matrix.shard }}
          path: .coverage.shard${{ matrix.shard }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  coverage:
    timeout-minutes: 10
    name: Coverage
    needs: coverage-shard
    # always(): a failed shard must fail this job. A skipped job here would read as
    # "not failed" to the jobs that gate on it.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Every shard succeeded
        if: ${{ needs.coverage-shard.result != 'success' }}
        run: |
          echo "::error::coverage shards ended with '${{ needs.coverage-shard.result }}'"
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Install the locked coverage version
        run: |
          uv venv
          version=$(uv export --frozen --no-hashes --extra dev | sed -n 's/^coverage==\([^ ;]*\).*/\1/p' | head -1)
          test -n "$version" || { echo "::error::coverage is not pinned in uv.lock"; exit 1; }
          uv pip install "coverage==$version"

      - name: Download coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-data-*
          path: coverage-data
          merge-multiple: true

      - name: Combine and apply the 90% floor
        # fail_under = 90 and the omit list come from [tool.coverage] in pyproject.toml.
        run: |
          .venv/bin/coverage combine coverage-data/
          .venv/bin/coverage report --fail-under=90

  create-tag:
    timeout-minutes: 10
    name: Create Release Tag
    needs:
      - derive-version
      - lint
      - test
      - coverage
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ needs.derive-version.outputs.version }}
      sha: ${{ needs.derive-version.outputs.sha }}
      published: ${{ steps.release.outputs.published }}
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub release and tag
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ needs.derive-version.outputs.version }}';
            const sha = '${{ needs.derive-version.outputs.sha }}';

            // Draft releases do not create a git ref. Create it explicitly so
            // every downstream checkout resolves the validated commit.
            try {
              const ref = await github.rest.git.getRef({
                ...context.repo, ref: `tags/${version}`,
              });
              const tagged = ref.data.object.type === 'tag'
                ? (await github.rest.repos.getCommit({...context.repo, ref: version})).data.sha
                : ref.data.object.sha;
              if (tagged !== sha) {
                throw new Error(`Tag ${version} does not point to ${sha}`);
              }
            } catch (e) {
              if (e.status !== 404) throw e;
              await github.rest.git.createRef({
                ...context.repo, ref: `refs/tags/${version}`, sha,
              });
            }

            const releases = await github.paginate(github.rest.repos.listReleases, context.repo);
            const existing = releases.find(release => release.tag_name === version);
            if (existing) {
              core.setOutput('release_id', existing.id);
              core.setOutput('published', String(!existing.draft));
              console.log(`Release ${version} already exists`);
              return;
            }

            const commit = await github.rest.repos.getCommit({
              ...context.repo, ref: sha,
            });
            const release = await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: version,
              target_commitish: sha,
              name: version,
              body: commit.data.commit.message,
              draft: true,
              make_latest: 'false',
            });
            core.setOutput('release_id', release.data.id);
            core.setOutput('published', 'false');
            console.log(`Created draft release ${version}`);

  release-artifacts:
    if: needs.create-tag.outputs.published != 'true'
    timeout-minutes: 20
    name: Build and Smoke Test Release Artifacts
    needs: create-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-tag.outputs.version }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Build tagged Python distributions
        id: build
        env:
          RELEASE_VERSION: ${{ needs.create-tag.outputs.version }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/release_packages.py --version "$RELEASE_VERSION" --repository "$RELEASE_REPOSITORY"
          python -c 'import os; from scripts.release_packages import normalize_version; print("package_version=" + normalize_version(os.environ["RELEASE_VERSION"]))' >> "$GITHUB_OUTPUT"

      - name: Export locked smoke dependencies with hashes
        id: export
        run: |
          uv export --frozen --no-dev --no-emit-local --output-file dist.requirements.txt
          uv export --frozen --no-dev --no-emit-local --project agent/performer --output-file performer.requirements.txt

      - name: Install and smoke test outside the checkout
        env:
          RELEASE_VERSION: ${{ steps.build.outputs.package_version }}
        shell: bash
        run: |
          set -euo pipefail
          tool_root="$(mktemp -d)"
          export SMOKE_ENV="$tool_root/venv"
          echo "SMOKE_ENV=$SMOKE_ENV" >> "$GITHUB_ENV"
          uv venv "$SMOKE_ENV"
          uv pip sync --python "$SMOKE_ENV/bin/python" --require-hashes dist.requirements.txt
          # Install the exact local wheels without resolving unpublished draft URLs.
          uv pip install --python "$SMOKE_ENV/bin/python" --no-deps "$PWD"/dist/coordinare*.whl
          uv pip check --python "$SMOKE_ENV/bin/python"
          test "$("$SMOKE_ENV/bin/coordinare" --version)" = "coordinare $RELEASE_VERSION"
          cp scripts/smoke_release.py "$tool_root/smoke_release.py"
          cd "$tool_root"
          "$SMOKE_ENV/bin/python" -I smoke_release.py "$RELEASE_VERSION"

      - name: Verify the optional subprocess performer beside the daemon
        env:
          RELEASE_VERSION: ${{ steps.build.outputs.package_version }}
        shell: bash
        run: |
          set -euo pipefail
          # Apply the performer's own locked dependencies for the optional install.
          uv pip install --python "$SMOKE_ENV/bin/python" --require-hashes -r performer.requirements.txt
          uv pip install --python "$SMOKE_ENV/bin/python" --no-deps "$PWD"/dist/performer-*.whl
          uv pip check --python "$SMOKE_ENV/bin/python"
          cd "$(mktemp -d)"
          "$SMOKE_ENV/bin/python" -I -c 'from importlib.metadata import version; import os; import performer.main; assert version("performer") == os.environ["RELEASE_VERSION"]; assert callable(performer.main.main)'

      - name: Checksum smoke tested release assets
        id: checksums
        working-directory: dist
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" SHA256SUMS

      - name: Transfer smoke tested release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error
          overwrite: true

  installer-smoke:
    if: needs.create-tag.outputs.published != 'true'
    timeout-minutes: 15
    name: Installer Smoke (${{ matrix.os }})
    needs:
      - create-tag
      - release-artifacts
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist/

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Install from release assets and verify both commands
        env:
          RELEASE_VERSION: ${{ needs.create-tag.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          assets="$PWD/dist"
          installer_home="$(mktemp -d)"
          export HOME="$installer_home"
          export COORDINARE_RELEASE_ROOT="file://$installer_home/releases"
          mkdir -p "$HOME/releases/download" "$HOME/releases/latest"
          ln -s "$assets" "$HOME/releases/download/$RELEASE_VERSION"
          ln -s "$assets" "$HOME/releases/latest/download"
          curl -fsSL "file://$assets/install.sh" | sh -s -- --yes --no-init
          normalized=$(printf '%s\n' "$RELEASE_VERSION" | awk -F. '{for (i=1; i<=NF; i++) printf "%s%d", (i==1 ? "" : "."), $i; print ""}')
          test "$("$HOME/.local/bin/coordinare" --version)" = "coordinare $normalized"
          test -x "$HOME/.local/bin/performer"
          mkdir "$HOME/.coordinare"
          printf 'keep\n' > "$HOME/.coordinare/config.yaml"
          sh "$assets/install.sh" --yes --no-init --version "$RELEASE_VERSION"
          test "$("$HOME/.local/bin/coordinare" --version)" = "coordinare $normalized"
          test "$(cat "$HOME/.coordinare/config.yaml")" = keep
          PATH="$HOME/.local/bin:$PATH" "$HOME/.local/share/uv/tools/coordinare/bin/python" -c 'import performer.main; from coordinare.presets import _performer_executable; import os; assert _performer_executable() == os.path.expanduser("~/.local/bin/performer")'
          sh "$assets/install.sh" --uninstall
          test -f "$HOME/.coordinare/config.yaml"
          test ! -e "$HOME/.local/bin/coordinare"

  publish-artifacts:
    if: needs.create-tag.outputs.published != 'true'
    timeout-minutes: 10
    name: Attest and Upload Release Artifacts
    needs:
      - create-tag
      - release-artifacts
      - installer-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download smoke tested release assets
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist/

      - name: Verify downloaded release assets
        id: verify
        working-directory: dist
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --strict -c SHA256SUMS
          # Check the inventory too: sha256sum does not reject extra files.
          python - <<'PY'
          from __future__ import annotations

          from pathlib import Path

          files = list(Path('.').iterdir())
          if any(path.is_symlink() or not path.is_file() for path in files):
              raise SystemExit('Release assets must be regular files')
          expected = sorted(
              line.partition('  ')[-1]
              for line in Path('SHA256SUMS').read_text().splitlines()
          )
          actual = sorted(path.name for path in files if path.name != 'SHA256SUMS')
          if expected != actual:
              raise SystemExit('Release assets do not match the checksum inventory')
          PY

      - name: Attest verified release assets and checksums
        id: attest
        uses: actions/attest@v4
        with:
          subject-path: dist/*
          create-storage-record: false

      - name: Remove matching assets from the draft
        id: cleanup
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-tag.outputs.release_id }}
        with:
          script: |
            const fs = require('node:fs');
            const names = new Set(fs.readdirSync('dist'));
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              ...context.repo, release_id: Number(process.env.RELEASE_ID),
            });
            for (const asset of assets) {
              if (names.has(asset.name)) {
                await github.rest.repos.deleteReleaseAsset({
                  ...context.repo, asset_id: asset.id,
                });
              }
            }

      - name: Upload verified assets and checksums to the draft
        id: upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.create-tag.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_VERSION" dist/*

  # 173a: image jobs are pinned to an architecture. Each arch is built on a
  # runner that IS that architecture — amd64 images on ubuntu-latest and arm64
  # images on ubuntu-24.04-arm — so a cross-arch `FROM` never happens. When the
  # base landed on a host of the wrong arch, `FROM` an arm64 base on an amd64
  # host failed with "exec /bin/sh: exec format error" and every publish job
  # downstream was skipped. The two images are joined into one manifest, so the
  # published image serves both.
  build-base-amd64:
    timeout-minutes: 10
    name: Build and Push Base Image (amd64)
    needs: create-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Check out the release tag so the image always matches the exact
          # commit that was validated — not the moving branch head.
          ref: ${{ needs.create-tag.outputs.version }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base image (amd64)
        run: |
          REGISTRY=$(cat registry)
          VERSION=${{ needs.create-tag.outputs.version }}

          docker build --platform linux/amd64 \
            -t "${REGISTRY}-base:${VERSION}-amd64" -f agent/performer/Dockerfile.base .
          docker push "${REGISTRY}-base:${VERSION}-amd64"
          echo "Pushed ${REGISTRY}-base:${VERSION}-amd64"

  build-base-arm64:
    timeout-minutes: 10
    name: Build and Push Base Image (arm64)
    needs: create-tag
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-tag.outputs.version }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base image (arm64)
        run: |
          REGISTRY=$(cat registry)
          VERSION=${{ needs.create-tag.outputs.version }}

          docker build --platform linux/arm64 \
            -t "${REGISTRY}-base:${VERSION}-arm64" -f agent/performer/Dockerfile.base .
          docker push "${REGISTRY}-base:${VERSION}-arm64"
          echo "Pushed ${REGISTRY}-base:${VERSION}-arm64"

  manifest-base:
    timeout-minutes: 10
    name: Base Image Manifest
    needs:
      - create-tag
      - build-base-amd64
      - build-base-arm64
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-tag.outputs.version }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Join the per-arch base images into one manifest
        run: |
          REGISTRY=$(cat registry)
          VERSION=${{ needs.create-tag.outputs.version }}

          docker buildx imagetools create -t "${REGISTRY}-base:${VERSION}" \
            "${REGISTRY}-base:${VERSION}-amd64" \
            "${REGISTRY}-base:${VERSION}-arm64"
          echo "Published ${REGISTRY}-base:${VERSION} (amd64 + arm64)"

  build-full-amd64:
    timeout-minutes: 10
    name: Build and Push Full Image (amd64)
    needs:
      - create-tag
      - build-base-amd64
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-tag.outputs.version }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The base is pulled by its ARCH-SPECIFIC tag, not the manifest tag.
      # Naming the manifest would reintroduce the original failure by another
      # route: the daemon would resolve it to whichever arch it prefers.
      - name: Build and push full image (amd64)
        run: |
          REGISTRY=$(cat registry)
          VERSION=${{ needs.create-tag.outputs.version }}

          docker build --platform linux/amd64 \
            --build-arg BASE_IMAGE="${REGISTRY}-base:${VERSION}-amd64" \
            -t "${REGISTRY}-full:${VERSION}-amd64" \
            -f agent/performer/Dockerfile.full \
            agent/performer/
          docker push "${REGISTRY}-full:${VERSION}-amd64"
          echo "Pushed ${REGISTRY}-full:${VERSION}-amd64"

  build-full-arm64:
    timeout-minutes: 10
    name: Build and Push Full Image (arm64)
    needs:
      - create-tag
      - build-base-arm64
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-tag.outputs.version }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push full image (arm64)
        run: |
          REGISTRY=$(cat registry)
          VERSION=${{ needs.create-tag.outputs.version }}

          docker build --platform linux/arm64 \
            --build-arg BASE_IMAGE="${REGISTRY}-base:${VERSION}-arm64" \
            -t "${REGISTRY}-full:${VERSION}-arm64" \
            -f agent/performer/Dockerfile.full \
            agent/performer/
          docker push "${REGISTRY}-full:${VERSION}-arm64"
          echo "Pushed ${REGISTRY}-full:${VERSION}-arm64"

  manifest-full:
    timeout-minutes: 10
    name: Full Image Manifest
    needs:
      - create-tag
      - build-full-amd64
      - build-full-arm64
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-tag.outputs.version }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Join the per-arch full images into one manifest
        run: |
          REGISTRY=$(cat registry)
          VERSION=${{ needs.create-tag.outputs.version }}

          docker buildx imagetools create -t "${REGISTRY}-full:${VERSION}" \
            "${REGISTRY}-full:${VERSION}-amd64" \
            "${REGISTRY}-full:${VERSION}-arm64"
          echo "Published ${REGISTRY}-full:${VERSION} (amd64 + arm64)"

  # The daemon image is pinned to amd64 rather than split by architecture: no
  # arm64 consumer runs it today, so a manifest with an arm64 half nothing runs
  # would be cost without a consumer. If coordinare is ever deployed on arm64,
  # split this the way the performer images above are split.
  build-daemon:
    timeout-minutes: 10
    name: Build and Push Daemon Image
    needs: create-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Check out the release tag so the image always matches the exact
          # commit that was validated — not the moving branch head.
          ref: ${{ needs.create-tag.outputs.version }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push daemon image
        run: |
          REGISTRY=$(cat registry-daemon)
          VERSION=${{ needs.create-tag.outputs.version }}

          docker build -t "${REGISTRY}:${VERSION}" -f Dockerfile.daemon .
          docker push "${REGISTRY}:${VERSION}"
          echo "Pushed ${REGISTRY}:${VERSION}"

          # Resolve the pushed tag to its content digest and publish it, so an
          # operator can pin the deployment with image.digest and get a
          # bit-identical image for the deployment's lifetime regardless of
          # what the mutable tag later points at. See issue #524.
          DIGEST=$(docker buildx imagetools inspect "${REGISTRY}:${VERSION}" --format '{{.Manifest.Digest}}')
          {
            echo "Daemon image \`${REGISTRY}:${VERSION}\` resolved to digest:"
            echo "\`${DIGEST}\`"
            echo ""
            echo "Pin it with \`image.digest\` in the chart values to make pod starts digest-stable."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Resolved ${REGISTRY}:${VERSION} to ${DIGEST}"

  publish-chart:
    timeout-minutes: 10
    name: Publish Chart
    # Consumes the version derive-version minted; derives nothing itself. The in-house scheme's
    # #2700 is the cautionary tale: its chart publish lived in a second workflow
    # computing 0.1.<commit-count>, so two versions existed for one push. Reading
    # needs.*.outputs.version is what keeps the tag, the images and the chart the
    # same string.
    needs:
      - derive-version
      - create-tag
      - build-daemon
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.derive-version.outputs.sha }}

      - name: Install helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # appVersion is the release version, not the commit SHA that in-house uses:
      # values.yaml pins image.tag to appVersion, and coordinare's images are
      # tagged with the release, so a SHA here would name an image that does not
      # exist.
      - name: Publish the chart at the minted version
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.derive-version.outputs.version }}'

          # Re-running this workflow on a pre-159 commit reuses that commit's
          # legacy tag, and Helm refuses a four-component version. Skip with a
          # reason rather than failing the build red: those releases predate the
          # chart being published at all, so there is nothing to publish for them.
          if ! printf '%s' "$version" | grep -qE '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "::notice::$version is a pre-159 release version and is not SemVer; skipping the chart publish"
            exit 0
          fi

          out="$(mktemp -d)"
          echo "== packaging coordinare ${version} =="
          helm package deploy/helm/coordinare \
            --version "${version}" --app-version "${version}" -d "${out}"
          helm push "${out}"/coordinare-*.tgz oci://ghcr.io/vividynamics/charts

  tag-latest:
    timeout-minutes: 10
    name: Tag Latest
    needs:
      - create-tag
      - manifest-base
      - manifest-full
      - build-daemon
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` is built with imagetools from the per-arch tags, not by pulling
      # and re-pushing. A pull collapses a multi-arch manifest to the puller's
      # own architecture, so `docker pull && docker tag && docker push` would
      # quietly publish a single-arch `latest` from a multi-arch release.
      - name: Tag base, full and daemon images as latest
        run: |
          REGISTRY=$(cat registry)
          DAEMON_REGISTRY=$(cat registry-daemon)
          VERSION=${{ needs.create-tag.outputs.version }}

          docker buildx imagetools create -t "${REGISTRY}-base:latest" \
            "${REGISTRY}-base:${VERSION}-amd64" \
            "${REGISTRY}-base:${VERSION}-arm64"

          docker buildx imagetools create -t "${REGISTRY}-full:latest" \
            "${REGISTRY}-full:${VERSION}-amd64" \
            "${REGISTRY}-full:${VERSION}-arm64"

          # The daemon is amd64 only, so its latest is a straight retag.
          docker buildx imagetools create -t "${DAEMON_REGISTRY}:latest" \
            "${DAEMON_REGISTRY}:${VERSION}"

          echo "Tagged ${REGISTRY}-base:latest → ${VERSION} (amd64 + arm64)"
          echo "Tagged ${REGISTRY}-full:latest → ${VERSION} (amd64 + arm64)"
          echo "Tagged ${DAEMON_REGISTRY}:latest → ${VERSION} (amd64)"

  publish-release:
    if: needs.create-tag.outputs.published != 'true'
    timeout-minutes: 10
    name: Publish Complete Release as Latest
    needs:
      - create-tag
      - publish-artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the fully uploaded release
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-tag.outputs.release_id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              ...context.repo,
              release_id: Number(process.env.RELEASE_ID),
              draft: false,
              make_latest: 'true',
            });
