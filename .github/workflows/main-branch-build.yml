name: Main Branch Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: main-branch-build
  cancel-in-progress: false

# General Linux builds use the ephemeral cluster pool; the persistent WSL2
# runner also matches linux/x64 but has repeatedly stalled Docker operations.
jobs:
  derive-version:
    name: Derive Version
    runs-on:
      - self-hosted
      - linux
      - x64
      - cluster
    permissions:
      contents: read
    outputs:
      version: ${{ steps.derive.outputs.version }}
      sha: ${{ steps.derive.outputs.sha }}
    steps:
      - name: Assert main branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "ERROR: This workflow must only run on main (got $GITHUB_REF). Aborting to prevent releasing unmerged code."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags --force

      # Derive the release version from the tags that already exist, rather than
      # reading a file committed on the branch.
      #
      # The file-based approach is what produced the stranded-PR-head problem:
      # a CalVer string stored in the repo goes stale on every branch, so PR CI
      # had to bump and push it, and a GITHUB_TOKEN push does not re-trigger CI,
      # leaving the PR head with zero checks and a BLOCKED state that looks like
      # a failure. Deriving here removes the need for any branch to hold a
      # correct version, so nothing can be stale and nothing needs bumping.
      #
      # Mirrors the org release.yml. See issue #215.
      - name: Derive CalVer version from existing tags
        id: derive
        shell: bash
        run: |
          set -euo pipefail

          # 159: YYYY.M.N, the scheme other in-house projects already mint, so every repo
          # in the org versions the same way. It is valid SemVer, which the old
          # YYYY.MM.DD[.N] was not (four components, zero-padded month) -- and that
          # is what lets the chart below be published at this exact string instead
          # of a mapping of it.
          #
          # Reuse a tag already pointing at HEAD rather than minting a second one
          # for the same commit: re-running this workflow must be idempotent. Both
          # shapes are accepted here, because the pre-159 tags are real releases
          # whose images are published under those names.
          existing="$(git tag --points-at HEAD | grep -E '^v?[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,2}(\.[0-9]+)?$' | head -n 1 || true)"
          if [ -n "$existing" ]; then
            echo "Reusing existing tag on HEAD: $existing"
            version="${existing#v}"
          else
            # The counter ignores the legacy four-component tags: 2026.09.01.3
            # parsed loosely offers a patch of 01, and the next mint would collide
            # with a tag that is already pushed. See tests/unit/test_159_calver.py.
            version="$(python3 .github/scripts/next_calver.py)"
            echo "Derived new version: $version"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint
    runs-on:
      - self-hosted
      - linux
      - x64
      - cluster
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Run Ruff
        run: uv run --extra dev ruff check src tests agent/performer/src

      - name: Ruff baseline (432 ratchet)
        run: uv run --extra dev python scripts/ruff_baseline.py

      - name: Typecheck (433 ratchet)
        run: uv run --extra dev mypy -p coordinare

  test:
    name: Test
    runs-on:
      - self-hosted
      - linux
      - x64
      - cluster
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Install coordinare and performer packages
        run: |
          uv venv
          uv pip install -e ".[dev]"
          uv pip install -e "agent/performer[dev]"

      - name: Run pytest
        run: uv run --extra dev pytest

  coverage:
    name: Coverage
    runs-on:
      - self-hosted
      - linux
      - x64
      - cluster
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Install coordinare and performer packages
        run: |
          uv venv
          uv pip install -e ".[dev]"
          uv pip install -e "agent/performer[dev]"

      - name: Run coverage
        run: uv run --extra dev pytest --cov=coordinare --cov-report=term-missing --cov-fail-under=90

  create-tag:
    name: Create Release Tag
    needs:
      - derive-version
      - lint
      - test
      - coverage
    runs-on:
      - self-hosted
      - linux
      - x64
      - cluster
    permissions:
      contents: write
    outputs:
      version: ${{ needs.derive-version.outputs.version }}
      sha: ${{ needs.derive-version.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub release and tag
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ needs.derive-version.outputs.version }}';
            const sha = '${{ needs.derive-version.outputs.sha }}';

            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: version,
              });
              console.log(`Release ${version} already exists — skipping`);
              return;
            } catch (e) {
              if (e.status !== 404) throw e;
            }

            const commit = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha,
            });

            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: version,
              target_commitish: sha,
              name: version,
              body: commit.data.commit.message,
            });
            console.log(`Created release ${version}`);

  # 173a: image jobs are pinned to an architecture. They used to ask only for
  # [self-hosted, linux], which matches BOTH the amd64 cluster pods and the
  # arm64 spark boxes, so which architecture an image was built for came down
  # to which runner happened to pick the job up. When the base landed on spark
  # and the full image on cluster, `FROM` an arm64 base on an amd64 host failed
  # with "exec /bin/sh: exec format error" and every publish job downstream was
  # skipped. Each arch is now built on the fleet that IS that arch, and the two
  # are joined into one manifest, so the published image serves both.
  build-base-amd64:
    name: Build and Push Base Image (amd64)
    needs: create-tag
    runs-on:
      - self-hosted
      - linux
      - x64
      - cluster
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Check out the release tag so the image always matches the exact
          # commit that was validated — not the moving branch head.
          ref: ${{ needs.create-tag.outputs.version }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base image (amd64)
        run: |
          REGISTRY=$(cat registry)
          VERSION=${{ needs.create-tag.outputs.version }}

          docker build --platform linux/amd64 \
            -t "${REGISTRY}-base:${VERSION}-amd64" -f agent/performer/Dockerfile.base .
          docker push "${REGISTRY}-base:${VERSION}-amd64"
          echo "Pushed ${REGISTRY}-base:${VERSION}-amd64"

  build-base-arm64:
    name: Build and Push Base Image (arm64)
    needs: create-tag
    runs-on:
      - self-hosted
      - macos
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-tag.outputs.version }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base image (arm64)
        run: |
          REGISTRY=$(cat registry)
          VERSION=${{ needs.create-tag.outputs.version }}

          docker build --platform linux/arm64 \
            -t "${REGISTRY}-base:${VERSION}-arm64" -f agent/performer/Dockerfile.base .
          docker push "${REGISTRY}-base:${VERSION}-arm64"
          echo "Pushed ${REGISTRY}-base:${VERSION}-arm64"

  manifest-base:
    name: Base Image Manifest
    needs:
      - create-tag
      - build-base-amd64
      - build-base-arm64
    runs-on:
      - self-hosted
      - linux
      - x64
      - cluster
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-tag.outputs.version }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Join the per-arch base images into one manifest
        run: |
          REGISTRY=$(cat registry)
          VERSION=${{ needs.create-tag.outputs.version }}

          docker buildx imagetools create -t "${REGISTRY}-base:${VERSION}" \
            "${REGISTRY}-base:${VERSION}-amd64" \
            "${REGISTRY}-base:${VERSION}-arm64"
          echo "Published ${REGISTRY}-base:${VERSION} (amd64 + arm64)"

  build-full-amd64:
    name: Build and Push Full Image (amd64)
    needs:
      - create-tag
      - build-base-amd64
    runs-on:
      - self-hosted
      - linux
      - x64
      - cluster
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-tag.outputs.version }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The base is pulled by its ARCH-SPECIFIC tag, not the manifest tag.
      # Naming the manifest would reintroduce the original failure by another
      # route: the daemon would resolve it to whichever arch it prefers.
      - name: Build and push full image (amd64)
        run: |
          REGISTRY=$(cat registry)
          VERSION=${{ needs.create-tag.outputs.version }}

          docker build --platform linux/amd64 \
            --build-arg BASE_IMAGE="${REGISTRY}-base:${VERSION}-amd64" \
            -t "${REGISTRY}-full:${VERSION}-amd64" \
            -f agent/performer/Dockerfile.full \
            agent/performer/
          docker push "${REGISTRY}-full:${VERSION}-amd64"
          echo "Pushed ${REGISTRY}-full:${VERSION}-amd64"

  build-full-arm64:
    name: Build and Push Full Image (arm64)
    needs:
      - create-tag
      - build-base-arm64
    runs-on:
      - self-hosted
      - macos
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-tag.outputs.version }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push full image (arm64)
        run: |
          REGISTRY=$(cat registry)
          VERSION=${{ needs.create-tag.outputs.version }}

          docker build --platform linux/arm64 \
            --build-arg BASE_IMAGE="${REGISTRY}-base:${VERSION}-arm64" \
            -t "${REGISTRY}-full:${VERSION}-arm64" \
            -f agent/performer/Dockerfile.full \
            agent/performer/
          docker push "${REGISTRY}-full:${VERSION}-arm64"
          echo "Pushed ${REGISTRY}-full:${VERSION}-arm64"

  manifest-full:
    name: Full Image Manifest
    needs:
      - create-tag
      - build-full-amd64
      - build-full-arm64
    runs-on:
      - self-hosted
      - linux
      - x64
      - cluster
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-tag.outputs.version }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Join the per-arch full images into one manifest
        run: |
          REGISTRY=$(cat registry)
          VERSION=${{ needs.create-tag.outputs.version }}

          docker buildx imagetools create -t "${REGISTRY}-full:${VERSION}" \
            "${REGISTRY}-full:${VERSION}-amd64" \
            "${REGISTRY}-full:${VERSION}-arm64"
          echo "Published ${REGISTRY}-full:${VERSION} (amd64 + arm64)"

  # The daemon is deployed to the amd64 cluster cluster and nowhere else, so it
  # is pinned rather than split: a manifest with an arm64 half nothing runs
  # would be cost without a consumer. If coordinare is ever deployed on arm64,
  # split this the way the performer images above are split.
  build-daemon:
    name: Build and Push Daemon Image
    needs: create-tag
    runs-on:
      - self-hosted
      - linux
      - x64
      - cluster
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Check out the release tag so the image always matches the exact
          # commit that was validated — not the moving branch head.
          ref: ${{ needs.create-tag.outputs.version }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push daemon image
        run: |
          REGISTRY=$(cat registry-daemon)
          VERSION=${{ needs.create-tag.outputs.version }}

          docker build -t "${REGISTRY}:${VERSION}" -f Dockerfile.daemon .
          docker push "${REGISTRY}:${VERSION}"
          echo "Pushed ${REGISTRY}:${VERSION}"

          # Resolve the pushed tag to its content digest and publish it, so an
          # operator can pin the deployment with image.digest and get a
          # bit-identical image for the deployment's lifetime regardless of
          # what the mutable tag later points at. See issue #524.
          DIGEST=$(docker buildx imagetools inspect "${REGISTRY}:${VERSION}" --format '{{.Manifest.Digest}}')
          {
            echo "Daemon image \`${REGISTRY}:${VERSION}\` resolved to digest:"
            echo "\`${DIGEST}\`"
            echo ""
            echo "Pin it with \`image.digest\` in the chart values to make pod starts digest-stable."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Resolved ${REGISTRY}:${VERSION} to ${DIGEST}"

  publish-chart:
    name: Publish Chart
    # Consumes the version derive-version minted; derives nothing itself. The in-house scheme's
    # #2700 is the cautionary tale: its chart publish lived in a second workflow
    # computing 0.1.<commit-count>, so two versions existed for one push. Reading
    # needs.*.outputs.version is what keeps the tag, the images and the chart the
    # same string.
    needs:
      - derive-version
      - create-tag
      - build-daemon
    runs-on:
      - self-hosted
      - linux
      - x64
      - cluster
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.derive-version.outputs.sha }}

      - name: Install helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # appVersion is the release version, not the commit SHA that in-house uses:
      # values.yaml pins image.tag to appVersion, and coordinare's images are
      # tagged with the release, so a SHA here would name an image that does not
      # exist.
      - name: Publish the chart at the minted version
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.derive-version.outputs.version }}'

          # Re-running this workflow on a pre-159 commit reuses that commit's
          # legacy tag, and Helm refuses a four-component version. Skip with a
          # reason rather than failing the build red: those releases predate the
          # chart being published at all, so there is nothing to publish for them.
          if ! printf '%s' "$version" | grep -qE '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "::notice::$version is a pre-159 release version and is not SemVer; skipping the chart publish"
            exit 0
          fi

          out="$(mktemp -d)"
          echo "== packaging coordinare ${version} =="
          helm package deploy/helm/coordinare \
            --version "${version}" --app-version "${version}" -d "${out}"
          helm push "${out}"/coordinare-*.tgz oci://ghcr.io/vividynamics/charts

  tag-latest:
    name: Tag Latest
    needs:
      - create-tag
      - manifest-base
      - manifest-full
      - build-daemon
    runs-on:
      - self-hosted
      - linux
      - x64
      - cluster
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` is built with imagetools from the per-arch tags, not by pulling
      # and re-pushing. A pull collapses a multi-arch manifest to the puller's
      # own architecture, so `docker pull && docker tag && docker push` would
      # quietly publish a single-arch `latest` from a multi-arch release.
      - name: Tag base, full and daemon images as latest
        run: |
          REGISTRY=$(cat registry)
          DAEMON_REGISTRY=$(cat registry-daemon)
          VERSION=${{ needs.create-tag.outputs.version }}

          docker buildx imagetools create -t "${REGISTRY}-base:latest" \
            "${REGISTRY}-base:${VERSION}-amd64" \
            "${REGISTRY}-base:${VERSION}-arm64"

          docker buildx imagetools create -t "${REGISTRY}-full:latest" \
            "${REGISTRY}-full:${VERSION}-amd64" \
            "${REGISTRY}-full:${VERSION}-arm64"

          # The daemon is amd64 only, so its latest is a straight retag.
          docker buildx imagetools create -t "${DAEMON_REGISTRY}:latest" \
            "${DAEMON_REGISTRY}:${VERSION}"

          echo "Tagged ${REGISTRY}-base:latest → ${VERSION} (amd64 + arm64)"
          echo "Tagged ${REGISTRY}-full:latest → ${VERSION} (amd64 + arm64)"
          echo "Tagged ${DAEMON_REGISTRY}:latest → ${VERSION} (amd64)"
