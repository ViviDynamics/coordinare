# Proves the claim behind the Windows env allowlist (PR #219) on real Windows,
# rather than trusting the comment that explains it.
#
# The claim: coordinare strips the environment to an allowlist before running git
# (spec 051), and on Windows that dropped SystemRoot. Winsock reads SystemRoot to
# locate its DNS provider DLLs, so every lookup inside the subprocess failed with
# "Could not resolve host" on a healthy network.
#
# Not a PR gate. This runs on demand and on pushes that touch the env-building code.
name: Windows git env

on:
  workflow_dispatch:
  push:
    paths:
      - "src/coordinare/lib/subprocess_env.py"
      - "src/coordinare/workspace.py"
      - "src/coordinare/transport/subprocess_transport.py"
      - ".github/workflows/windows-git-env.yml"
      - ".github/scripts/windows_git_env_probe.py"

# Never queue two of these behind each other.
concurrency:
  group: windows-git-env
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-git-env:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The probe steps run from the repo root, which they address as "src".
          path: src

      - name: Find an interpreter
        run: |
          $candidates = @("python", "python3", "py")
          $found = $null
          foreach ($c in $candidates) {
            $cmd = Get-Command $c -ErrorAction SilentlyContinue
            if ($cmd) {
              $version = & $c --version 2>&1
              Write-Host "$c -> $version"
              if ($null -eq $found) { $found = $cmd.Source }
            } else {
              Write-Host "$c -> not present"
            }
          }
          if ($null -eq $found) {
            Write-Host "::error::no Python on this runner; the probe cannot run"
            exit 1
          }
          Write-Host "using $found"
          "PYEXE=$found" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Runner identity
        run: |
          Write-Host "RUNNER_NAME = $env:RUNNER_NAME"
          Write-Host "RUNNER_OS   = $env:RUNNER_OS"
          Write-Host "SystemRoot  = $env:SystemRoot"
          git --version

      # The experiment, in the order that makes it an experiment: show the
      # failure first, so a pass on the second step means something.
      - name: A stripped env with no SystemRoot cannot resolve a host
        working-directory: src
        run: |
          $env:PYTHONIOENCODING = "utf-8"
          & $env:PYEXE .github/scripts/windows_git_env_probe.py --without-systemroot
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::the probe did not behave as expected -- read its output above"
            exit 1
          }

      # Review asked whether the user-directory names reopen the hole spec 051
      # exists to close. Whether git needs them is a fact about Windows, so it
      # is measured here.
      - name: Are the user-directory vars needed, and what do they expose
        working-directory: src
        run: |
          $env:PYTHONIOENCODING = "utf-8"
          & $env:PYEXE .github/scripts/windows_git_env_probe.py --credential-boundary
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::git needs the user-directory vars on this host; read the output"
            exit 1
          }

      - name: The allowlist coordinare actually builds does resolve
        working-directory: src
        run: |
          $env:PYTHONIOENCODING = "utf-8"
          & $env:PYEXE .github/scripts/windows_git_env_probe.py --with-coordinare-env
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::coordinare's Windows env still cannot resolve a host"
            exit 1
          }
