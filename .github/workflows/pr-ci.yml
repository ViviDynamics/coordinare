name: Pull Request CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-version:
    name: Validate Version
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on:
      - self-hosted
      - linux
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch tags
        run: git fetch --tags

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Validate and auto-bump if needed
        run: |
          if python3 bin/validate-version; then
            echo "Version is valid"
          else
            echo "Version is invalid — auto-bumping before merge"
            # Loop until valid: on busy days the same-day tag counter may be >1
            # above the current version, so a single bump is not always enough.
            bumped=false
            for attempt in $(seq 1 10); do
              python3 bin/update-version
              if python3 bin/validate-version 2>/dev/null; then
                bumped=true
                break
              fi
            done
            if [ "$bumped" = "false" ]; then
              echo "ERROR: could not find a valid version after 10 bumps"
              python3 bin/validate-version  # hard fail with details
            fi
            git add version
            git commit -m "[ci] Bump version to $(cat version)"
            # GITHUB_TOKEN push: does not re-trigger PR CI (GitHub design).
            # The bumped version is committed to the branch and will be included
            # in the squash merge. Developers should git pull before merging.
            git push
          fi

  lint:
    name: Lint
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on:
      - self-hosted
      - linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Run Ruff
        run: uv run --extra dev ruff check src tests

  test:
    name: Test
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on:
      - self-hosted
      - linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Install coordinare and performer packages
        run: |
          uv venv
          uv pip install -e ".[dev]"
          uv pip install -e "agent/performer[dev]"

      - name: Run pytest
        run: uv run pytest

  coverage:
    name: Coverage
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on:
      - self-hosted
      - linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Install coordinare and performer packages
        run: |
          uv venv
          uv pip install -e ".[dev]"
          uv pip install -e "agent/performer[dev]"

      - name: Run coverage
        run: uv run pytest --cov=coordinare --cov-report=term-missing --cov-fail-under=90

  e2e:
    name: E2E Browser Tests
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on:
      - self-hosted
      - linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Install Playwright browsers
        run: uv run --extra dev playwright install --with-deps chromium firefox

      - name: Run E2E tests
        run: uv run --extra dev pytest tests/e2e/ --override-ini="addopts=" --browser chromium --browser firefox -v

  performer:
    name: Performer Tests
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on:
      - self-hosted
      - linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Install coordinare and performer packages
        run: |
          uv venv
          uv pip install -e "."
          uv pip install -e "agent/performer[dev]"

      - name: Run performer tests
        run: uv run pytest agent/performer/tests/ -q --ignore=agent/performer/tests/integration

  docker:
    name: Docker Images
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    needs: validate-version
    runs-on:
      - self-hosted
      - linux
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Check out the branch tip (not the triggering SHA) so that any version
          # bump committed by validate-version is reflected in the image tag.
          ref: ${{ github.head_ref }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build base image
        run: docker build -t coordinare-performer:base -f agent/performer/Dockerfile.base .

      - name: Build full image
        run: docker build -t coordinare-performer:full -f agent/performer/Dockerfile.full agent/performer/

      - name: Verify image size gap (SC-007 — full must be ≥ 150 MB larger than base)
        run: |
          python3 - <<'EOF'
          import subprocess, json
          base = int(json.loads(subprocess.check_output(
            ["docker", "inspect", "--format", "{{json .Size}}", "coordinare-performer:base"])))
          full = int(json.loads(subprocess.check_output(
            ["docker", "inspect", "--format", "{{json .Size}}", "coordinare-performer:full"])))
          gap = full - base
          print(f"base={base/1e6:.0f} MB  full={full/1e6:.0f} MB  gap={gap/1e6:.0f} MB")
          assert gap >= 150_000_000, f"SC-007 FAIL: gap {gap/1e6:.0f} MB < 150 MB (Node.js LTS missing?)"
          print("SC-007 PASS")
          EOF

      - name: Push snapshot images to GHCR
        run: |
          REGISTRY=$(cat registry)
          VERSION=$(cat version)
          SNAPSHOT_TAG="${VERSION}-SNAPSHOT"

          docker tag coordinare-performer:base "${REGISTRY}-base:${SNAPSHOT_TAG}"
          docker tag coordinare-performer:full "${REGISTRY}-full:${SNAPSHOT_TAG}"

          docker push "${REGISTRY}-base:${SNAPSHOT_TAG}"
          docker push "${REGISTRY}-full:${SNAPSHOT_TAG}"

          echo "Pushed ${REGISTRY}-base:${SNAPSHOT_TAG}"
          echo "Pushed ${REGISTRY}-full:${SNAPSHOT_TAG}"

  benchmark:
    name: Performance Benchmarks
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    continue-on-error: true
    runs-on:
      - self-hosted
      - linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Install coordinare and performer packages
        run: |
          uv venv
          uv pip install -e "."
          uv pip install -e "agent/performer[dev]"

      - name: Run performance benchmarks (T067)
        run: uv run --extra dev pytest tests/benchmarks/test_performer_perf.py -v -m benchmark

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmarks/results/
          if-no-files-found: ignore

  build-success:
    name: Build Success
    # always() prevents skipped upstream jobs (e.g. benchmark on non-performer PRs)
    # from silently skipping this gate job. The failure/cancelled checks ensure
    # we only succeed when all required jobs passed.
    if: >-
      always() &&
      (github.event_name != 'pull_request' || !github.event.pull_request.draft) &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on:
      - self-hosted
      - linux
    needs:
      - validate-version
      - lint
      - test
      - coverage
      - e2e
      - performer
      - docker
      - benchmark
    steps:
      - name: Mark build successful
        run: echo "Lint, tests, coverage, performer tests, E2E browser tests, Docker image builds, and benchmarks passed. Build successful."
