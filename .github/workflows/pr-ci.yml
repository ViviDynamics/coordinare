name: Pull Request CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # 333: only packaging changes need the extra release architecture and smoke.
  release-changes:
    name: Release path filter
    timeout-minutes: 5
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release: ${{ steps.paths.outputs.release }}
    steps:
      - name: Detect release-relevant paths
        uses: dorny/paths-filter@v4
        id: paths
        with:
          filters: |
            release:
              - 'pyproject.toml'
              - 'uv.lock'
              - 'agent/performer/pyproject.toml'
              - 'agent/performer/uv.lock'
              - 'agent/performer/README.md'
              - 'agent/performer/src/**'
              - 'agent/performer/entrypoint.sh'
              - 'agent/performer/devenv-profile.sh'
              - 'agent/performer/.dockerignore'
              - 'agent/performer/Dockerfile.full.dockerignore'
              - 'packages/service_inference/**'
              - 'packages/routing_models/**'
              - 'packages/ci_detection/**'
              - '.dockerignore'
              - 'agent/performer/Dockerfile.base.dockerignore'
              - 'Dockerfile.daemon'
              - 'agent/performer/Dockerfile.base'
              - 'agent/performer/Dockerfile.full'
              - 'registry'
              - 'registry-daemon'
              - 'bin/build'
              - 'Makefile'
              - '.github/scripts/**'
              - '.github/workflows/pr-ci.yml'
              - 'scripts/resolve_smoke_release.sh'
              - 'src/coordinare/services/env_manifest.py'
              - 'tests/unit/test_env_manifest.py'
              - 'tests/unit/test_197_review_fixes.py'
              - 'tests/unit/test_197_rereview.py'
              - 'tests/unit/test_333_release_pr_ci.py'
              - 'tests/utils/smoke_release.py'

  release-smoke:
    name: Release build and smoke (arm64)
    timeout-minutes: 20
    needs: release-changes
    if: ${{ !github.event.pull_request.draft && needs.release-changes.outputs.release == 'true' }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Match main-branch-build's native arm64 build, without publishing images.
      - name: Build release base image (arm64)
        run: docker build --platform linux/arm64 -t coordinare-performer:pr-arm64 -f agent/performer/Dockerfile.base .

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Resolve the newest release with published images
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/resolve_smoke_release.sh

      - name: Install coordinare and performer packages
        run: |
          uv venv
          uv pip install -e ".[dev]"
          uv pip install -e "agent/performer[dev]"

      - name: Check environment manifest and release selection fallbacks
        run: |
          uv run --extra dev pytest -q tests/unit/test_env_manifest.py \
            tests/unit/test_197_review_fixes.py tests/unit/test_197_rereview.py

  lint:
    timeout-minutes: 10
    name: Lint
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Run Ruff
        run: uv run --extra dev ruff check src tests agent/performer/src

      - name: Ruff baseline (432 ratchet)
        run: uv run --extra dev python scripts/ruff_baseline.py

      - name: Typecheck (433 ratchet)
        run: uv run --extra dev mypy -p coordinare

  test:
    timeout-minutes: 20
    name: Test (${{ matrix.shard }}/4)
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    # 289: four parallel shards; scripts/ci_shard.py puts every test file in exactly one.
    # tests/e2e holds only browser tests, which the E2E lane runs, so these shards skip it.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Install coordinare and performer packages
        run: |
          uv venv
          uv pip install -e ".[dev]"
          uv pip install -e "agent/performer[dev]"

      - name: Run pytest
        # The list is captured first: inside a command argument a failed
        # $(...) would leave pytest with no paths, and it would run everything.
        run: |
          files=$(python scripts/ci_shard.py --shard ${{ matrix.shard }} --of 4 tests --exclude tests/e2e)
          uv run pytest --junitxml=junit-test-${{ matrix.shard }}.xml $files

      - name: Verify OTLP wire protocols and licences
        if: ${{ matrix.shard == 1 }}
        run: |
          uv sync --extra otlp --extra dev --inexact
          uv run --no-sync python -c "import grpc; import google.protobuf; import opentelemetry.proto.collector.logs.v1.logs_service_pb2"
          uv run --no-sync pytest tests/unit/test_271_otlp_wire.py tests/unit/test_142_license_and_legal_posture.py -v

      - name: Upload test timings
        # 289: scripts/ci_durations.py turns these into tests/ci-durations.json to rebalance shards.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: junit-test-${{ matrix.shard }}
          path: junit-test-${{ matrix.shard }}.xml
          retention-days: 14

  chart:
    timeout-minutes: 10
    name: Chart
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      # A separate job rather than steps bolted onto Test: the chart assertions
      # need helm, and without it they would *skip* inside Test and read as a
      # pass. A check that silently verifies nothing is worse than no check.
      - name: Install helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.2

      - name: Install coordinare
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Lint the chart
        run: helm lint deploy/helm/coordinare

      - name: Verify the rendered chart
        # Both files. test_146 asserts the controller Pod cannot match the orphan
        # sweep, which it checks by RENDERING the chart — so it needs helm, skips in
        # the Test job that lacks it, and would otherwise be verified nowhere.
        run: |
          uv run pytest tests/unit/test_147_helm_deployment.py \
                        tests/unit/test_146_kubernetes_transport.py \
                        tests/unit/test_225_kubernetes_egress.py \
                        tests/unit/test_271_export_chart.py -v

  daemon-image:
    timeout-minutes: 10
    name: Daemon Image
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Install coordinare
        run: |
          uv venv
          uv pip install -e ".[dev]"

      # The Docker deployment path had no coverage at all, and was unbuildable
      # for months before anyone noticed (#223). The image is built and published
      # by main-branch-build.yml, so without this a break is only discovered
      # after merge, by the release pipeline.
      - name: Verify the daemon image builds and runs
        run: uv run pytest tests/integration/test_148_docker_daemon_image.py -v

  chart-install:
    timeout-minutes: 10
    name: Chart Install (kind)
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      # kind and helm are not used by any other workflow, so their presence on a
      # stock GitHub-hosted runner cannot be assumed. Both are single binaries.
      - name: Install helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.2

      - name: Install kind
        uses: helm/kind-action@v1
        with:
          cluster_name: coordinare-ci
          wait: 120s

      - name: Build and load the daemon image
        run: |
          docker build -t coordinare-daemon:dev -f Dockerfile.daemon .
          kind load docker-image coordinare-daemon:dev --name coordinare-ci

      # 159: the pod-level e2e needs the performer image in the cluster. Built
      # from Dockerfile.base rather than :full -- the test starts a Pod and talks
      # to its /status, which base serves, and full adds several minutes of
      # toolchain to every PR for nothing this test asserts.
      - name: Build and load the performer image
        run: |
          docker build -t coordinare-performer:base -f agent/performer/Dockerfile.base .
          kind load docker-image coordinare-performer:base --name coordinare-ci

      - name: Install coordinare
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Install the chart and verify it
        run: uv run pytest tests/integration/test_147_helm_install.py -v

      # Spec 146's SC-001 lives here. Until now the Kubernetes performer path was
      # exercised by nothing that runs on its own, so "it works on Kubernetes"
      # rested on a hand-run spike.
      #
      # -rs and the grep are load-bearing: this file SKIPS when no cluster is
      # reachable, and a skip in CI is indistinguishable from a pass. Its own
      # docstring names that as the failure mode it exists to avoid.
      - name: Verify performers run as Pods
        # On a GitHub-hosted runner there is no in-cluster configuration to
        # shadow the kind kubeconfig, but these two are blanked anyway so the
        # in-cluster detection fails deterministically and the client falls
        # back to the kubeconfig kind-action wrote -- the cluster this job
        # built. (On the ARC runners this job used, load_incluster_config()
        # SUCCEEDS and wins -- it surfaced as sixteen 403s from
        # system:serviceaccount:github-actions:... rather than anything about
        # coordinare.)
        #
        # Worth knowing beyond CI: coordinare's k8s runtime prefers in-cluster
        # credentials by design (that is its supported deployment), so anything
        # exercising it from inside a cluster targets THAT cluster whatever the
        # kubeconfig says.
        env:
          KUBERNETES_SERVICE_HOST: ""
          KUBERNETES_SERVICE_PORT: ""
        run: |
          set -euo pipefail
          # A per-run file: "${RUNNER_TEMP}" is scoped to the job, where /tmp is
          # whatever the runner host shares.
          log="${RUNNER_TEMP:-/tmp}/e2e-${GITHUB_RUN_ID:-local}-${GITHUB_JOB:-job}.txt"
          uv run pytest tests/integration/test_146_kind_e2e.py -v -rs 2>&1 | tee "$log"

          # Every way this file can report having proved nothing. A skip is the
          # one it is designed to do when no cluster is reachable, but a suite
          # that xfails, deselects or collects nothing is equally vacuous and
          # equally green.
          if grep -qE "^SKIPPED|[0-9]+ (skipped|xfailed|xpassed|deselected)|no tests ran|collected 0 items" "$log"; then
            echo "::error::the Kubernetes pod e2e did not actually run here; it proves nothing"
            exit 1
          fi
          # And it must have positively passed something.
          if ! grep -qE "[0-9]+ passed" "$log"; then
            echo "::error::the Kubernetes pod e2e reported no passing tests"
            exit 1
          fi

  coverage-shard:
    timeout-minutes: 25
    name: Coverage (${{ matrix.shard }}/4)
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    # 289: each shard records partial data; the Coverage job combines it and applies the floor.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Install coordinare and performer packages
        run: |
          uv venv
          uv pip install -e ".[dev]"
          uv pip install -e "agent/performer[dev]"

      - name: Run coverage shard
        env:
          COVERAGE_FILE: .coverage.shard${{ matrix.shard }}
        # The 90% floor applies to the combined data only, so a shard reports without failing on it.
        # The list is captured first: inside a command argument a failed
        # $(...) would leave pytest with no paths, and it would run everything.
        run: |
          files=$(python scripts/ci_shard.py --shard ${{ matrix.shard }} --of 4 tests --exclude tests/e2e)
          uv run pytest --cov=coordinare --cov-report= --cov-fail-under=0 $files

      - name: Upload coverage data
        uses: actions/upload-artifact@v6
        with:
          name: coverage-data-${{ matrix.shard }}
          path: .coverage.shard${{ matrix.shard }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  coverage:
    timeout-minutes: 10
    name: Coverage
    needs: coverage-shard
    # always(): a failed shard must fail this job. A skipped job here would read as
    # "not failed" to the jobs that gate on it.
    if: ${{ always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    steps:
      - name: Every shard succeeded
        if: ${{ needs.coverage-shard.result != 'success' }}
        run: |
          echo "::error::coverage shards ended with '${{ needs.coverage-shard.result }}'"
          exit 1

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Install the locked coverage version
        run: |
          uv venv
          version=$(uv export --frozen --no-hashes --extra dev | sed -n 's/^coverage==\([^ ;]*\).*/\1/p' | head -1)
          test -n "$version" || { echo "::error::coverage is not pinned in uv.lock"; exit 1; }
          uv pip install "coverage==$version"

      - name: Download coverage data
        uses: actions/download-artifact@v7
        with:
          pattern: coverage-data-*
          path: coverage-data
          merge-multiple: true

      - name: Combine and apply the 90% floor
        # fail_under = 90 and the omit list come from [tool.coverage] in pyproject.toml.
        run: |
          .venv/bin/coverage combine coverage-data/
          .venv/bin/coverage report --fail-under=90

  e2e:
    timeout-minutes: 25
    name: E2E (${{ matrix.browser }} ${{ matrix.shard }}/3)
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    # 289: each browser runs in three file shards, six jobs in parallel.
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
        shard: [1, 2, 3]
    # Browser OS libraries live in the official image, so this lane does not
    # require passwordless sudo on the GitHub-hosted runner that receives it.
    # Keep the image version aligned with the Playwright package in uv.lock.
    container:
      image: mcr.microsoft.com/playwright/python:v1.58.0-noble
      options: --ipc=host
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Install Playwright browsers
        run: uv run --extra dev playwright install ${{ matrix.browser }}

      - name: Install coordinare and performer packages
        # The routing write path validates against performer.proxy.routing. Without the performer
        # package every real routing save is refused, so the E2E job installs it as the Tests job does.
        # The Playwright step's `uv run` already created .venv; install into it.
        run: |
          uv pip install -e ".[dev]"
          uv pip install -e "agent/performer[dev]"

      - name: Run E2E tests
        # Actions mounts /github/home with the host runner UID. Firefox refuses
        # to run as container root with that foreign-owned home directory.
        env:
          HOME: /root
        # The list is captured first: inside a command argument a failed
        # $(...) would leave pytest with no paths, and it would run everything.
        run: |
          files=$(python scripts/ci_shard.py --shard ${{ matrix.shard }} --of 3 tests/e2e)
          uv run --extra dev pytest --override-ini="addopts=" --override-ini="timeout_method=thread" --browser ${{ matrix.browser }} --tracing retain-on-failure -v --junitxml=junit-e2e-${{ matrix.browser }}-${{ matrix.shard }}.xml $files

      - name: Upload failed browser traces
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: browser-traces-${{ matrix.browser }}-${{ matrix.shard }}
          path: test-results/**/trace.zip
          retention-days: 3
          if-no-files-found: ignore

      - name: Upload test timings
        # 289: scripts/ci_durations.py turns these into tests/ci-durations.json to rebalance shards.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: junit-e2e-${{ matrix.browser }}-${{ matrix.shard }}
          path: junit-e2e-${{ matrix.browser }}-${{ matrix.shard }}.xml
          retention-days: 14

  performer:
    timeout-minutes: 10
    name: Performer Tests
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Install coordinare and performer packages
        run: |
          uv venv
          uv pip install -e "."
          uv pip install -e "agent/performer[dev]"

      - name: Run performer tests
        run: uv run pytest agent/performer/tests/ -q --ignore=agent/performer/tests/integration

  docker:
    timeout-minutes: 10
    name: Docker Images
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Check out the branch tip (not the triggering SHA) so that any version
          # image tag is derived from the commit, so no version file is involved.
          ref: ${{ github.head_ref }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build base image
        run: docker build -t coordinare-performer:base -f agent/performer/Dockerfile.base .

      - name: Build full image
        run: docker build -t coordinare-performer:full -f agent/performer/Dockerfile.full agent/performer/

      # 218: the real-docker verify decision, run against the image built just above. The Test job
      # deselects the docker_image lane, so this is the only place it runs. Advisory job. The docker
      # setup mirrors the Daemon Image job. It adds roughly two minutes (Python and uv setup, the
      # dependency install); the image build is already in this job.
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Install coordinare
        run: |
          uv venv
          uv pip install -e ".[dev]"
          # 234: the provenance lane imports the performer package (materialise, the server models), as the other jobs do.
          uv pip install -e "agent/performer[dev]"

      # Prepare the immutable image once before pytest starts its per-test timeout.
      # Both trust lanes retain the normal 30-second test deadline and all assertions.
      - name: Verify clean environment and frozen provenance (specs 218 and 234)
        env:
          COORDINARE_DOCKER_IMAGE_TESTS: "1"
          COORDINARE_E2E_PERFORMER_IMAGE: coordinare-performer:full
        run: >-
          uv run python -m tests.integration.reviewed_environment
          tests/integration/test_218_verify_real_image.py
          tests/integration/test_234_real_image.py -v

      - name: Verify image size gap (SC-007 — full must be ≥ 150 MB larger than base)
        run: |
          python3 - <<'EOF'
          import subprocess, json
          base = int(json.loads(subprocess.check_output(
            ["docker", "inspect", "--format", "{{json .Size}}", "coordinare-performer:base"])))
          full = int(json.loads(subprocess.check_output(
            ["docker", "inspect", "--format", "{{json .Size}}", "coordinare-performer:full"])))
          gap = full - base
          print(f"base={base/1e6:.0f} MB  full={full/1e6:.0f} MB  gap={gap/1e6:.0f} MB")
          assert gap >= 150_000_000, f"SC-007 FAIL: gap {gap/1e6:.0f} MB < 150 MB (Node.js LTS missing?)"
          print("SC-007 PASS")
          EOF

      - name: Push snapshot images to GHCR
        run: |
          REGISTRY=$(cat registry)
          # Identify a PR snapshot by its commit rather than by a version file.
          # That file was the source of the stranded-PR-head problem (#215): a
          # CalVer string stored on the branch goes stale, so CI had to bump and
          # push it, and a GITHUB_TOKEN push does not re-trigger CI. A snapshot
          # is better identified by the commit it was built from in any case.
          SNAPSHOT_TAG="$(git rev-parse --short HEAD)-SNAPSHOT"

          docker tag coordinare-performer:base "${REGISTRY}-base:${SNAPSHOT_TAG}"
          docker tag coordinare-performer:full "${REGISTRY}-full:${SNAPSHOT_TAG}"

          docker push "${REGISTRY}-base:${SNAPSHOT_TAG}"
          docker push "${REGISTRY}-full:${SNAPSHOT_TAG}"

          echo "Pushed ${REGISTRY}-base:${SNAPSHOT_TAG}"
          echo "Pushed ${REGISTRY}-full:${SNAPSHOT_TAG}"

  benchmark:
    timeout-minutes: 10
    name: Performance Benchmarks
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Install coordinare and performer packages
        run: |
          uv venv
          uv pip install -e "."
          uv pip install -e "agent/performer[dev]"

      - name: Run performance benchmarks (T067)
        run: uv run --extra dev pytest tests/benchmarks/test_performer_perf.py -v -m benchmark

      - name: Upload benchmark results
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-results
          path: benchmarks/results/
          if-no-files-found: ignore

  skills-wiring:
    timeout-minutes: 10
    name: Skills Wiring
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify workflow skills are wired
        run: |
          cp repo.env.example repo.env
          .agents/skills/ci-safety/scripts/check-wiring

  quality-guard:
    timeout-minutes: 10
    name: Quality guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Pull the latest code
        uses: actions/checkout@v6
      - name: Block weakened quality gates unless the PR justifies them
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp repo.env.example repo.env
          .agents/skills/merge-pr/scripts/quality-guard --pr ${{ github.event.pull_request.number }}

  build-success:
    timeout-minutes: 10
    name: Build Success
    # always() prevents skipped upstream jobs (e.g. benchmark on non-performer PRs)
    # from silently skipping this gate job. The failure/cancelled checks ensure
    # we only succeed when all required jobs passed.
    if: >-
      always() &&
      (github.event_name != 'pull_request' || !github.event.pull_request.draft) &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
      - coverage
      - e2e
      - performer
      - docker
      - benchmark
    steps:
      - name: Mark build successful
        run: echo "Lint, tests, coverage, performer tests, E2E browser tests, Docker image builds, and benchmarks passed. Build successful."
