name: Pull Request CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on:
      - self-hosted
      - linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Run Ruff
        run: uv run --extra dev ruff check src tests

  test:
    name: Test
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on:
      - self-hosted
      - linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Install coordinare and performer packages
        run: |
          uv venv
          uv pip install -e ".[dev]"
          uv pip install -e "agent/performer[dev]"

      - name: Run pytest
        run: uv run pytest

  chart:
    name: Chart
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on:
      - self-hosted
      - linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      # A separate job rather than steps bolted onto Test: the chart assertions
      # need helm, and without it they would *skip* inside Test and read as a
      # pass. A check that silently verifies nothing is worse than no check.
      - name: Install helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Install coordinare
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Lint the chart
        run: helm lint deploy/helm/coordinare

      - name: Verify the rendered chart
        run: uv run pytest tests/unit/test_147_helm_deployment.py -v

  daemon-image:
    name: Daemon Image
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on:
      - self-hosted
      - linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Install coordinare
        run: |
          uv venv
          uv pip install -e ".[dev]"

      # The Docker deployment path had no coverage at all, and was unbuildable
      # for months before anyone noticed (#223). The image is built and published
      # by main-branch-build.yml, so without this a break is only discovered
      # after merge, by the release pipeline.
      - name: Verify the daemon image builds and runs
        run: uv run pytest tests/integration/test_148_docker_daemon_image.py -v

  chart-install:
    name: Chart Install (kind)
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on:
      - self-hosted
      - linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      # kind and helm are not used by any other workflow, so their presence on a
      # self-hosted runner cannot be assumed. Both are single binaries.
      - name: Install helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Install kind
        uses: helm/kind-action@v1
        with:
          cluster_name: coordinare-ci
          wait: 120s

      - name: Build and load the daemon image
        run: |
          docker build -t coordinare-daemon:dev -f Dockerfile.daemon .
          kind load docker-image coordinare-daemon:dev --name coordinare-ci

      - name: Install coordinare
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Install the chart and verify it
        run: uv run pytest tests/integration/test_147_helm_install.py -v

  coverage:
    name: Coverage
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on:
      - self-hosted
      - linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Install coordinare and performer packages
        run: |
          uv venv
          uv pip install -e ".[dev]"
          uv pip install -e "agent/performer[dev]"

      - name: Run coverage
        run: uv run pytest --cov=coordinare --cov-report=term-missing --cov-fail-under=90

  e2e:
    name: E2E Browser Tests
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on:
      - self-hosted
      - linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Install Playwright browsers
        run: uv run --extra dev playwright install --with-deps chromium firefox

      - name: Run E2E tests
        run: uv run --extra dev pytest tests/e2e/ --override-ini="addopts=" --browser chromium --browser firefox -v

  performer:
    name: Performer Tests
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on:
      - self-hosted
      - linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Install coordinare and performer packages
        run: |
          uv venv
          uv pip install -e "."
          uv pip install -e "agent/performer[dev]"

      - name: Run performer tests
        run: uv run pytest agent/performer/tests/ -q --ignore=agent/performer/tests/integration

  docker:
    name: Docker Images
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on:
      - self-hosted
      - linux
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Check out the branch tip (not the triggering SHA) so that any version
          # image tag is derived from the commit, so no version file is involved.
          ref: ${{ github.head_ref }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build base image
        run: docker build -t coordinare-performer:base -f agent/performer/Dockerfile.base .

      - name: Build full image
        run: docker build -t coordinare-performer:full -f agent/performer/Dockerfile.full agent/performer/

      - name: Verify image size gap (SC-007 — full must be ≥ 150 MB larger than base)
        run: |
          python3 - <<'EOF'
          import subprocess, json
          base = int(json.loads(subprocess.check_output(
            ["docker", "inspect", "--format", "{{json .Size}}", "coordinare-performer:base"])))
          full = int(json.loads(subprocess.check_output(
            ["docker", "inspect", "--format", "{{json .Size}}", "coordinare-performer:full"])))
          gap = full - base
          print(f"base={base/1e6:.0f} MB  full={full/1e6:.0f} MB  gap={gap/1e6:.0f} MB")
          assert gap >= 150_000_000, f"SC-007 FAIL: gap {gap/1e6:.0f} MB < 150 MB (Node.js LTS missing?)"
          print("SC-007 PASS")
          EOF

      - name: Push snapshot images to GHCR
        run: |
          REGISTRY=$(cat registry)
          # Identify a PR snapshot by its commit rather than by a version file.
          # That file was the source of the stranded-PR-head problem (#215): a
          # CalVer string stored on the branch goes stale, so CI had to bump and
          # push it, and a GITHUB_TOKEN push does not re-trigger CI. A snapshot
          # is better identified by the commit it was built from in any case.
          SNAPSHOT_TAG="$(git rev-parse --short HEAD)-SNAPSHOT"

          docker tag coordinare-performer:base "${REGISTRY}-base:${SNAPSHOT_TAG}"
          docker tag coordinare-performer:full "${REGISTRY}-full:${SNAPSHOT_TAG}"

          docker push "${REGISTRY}-base:${SNAPSHOT_TAG}"
          docker push "${REGISTRY}-full:${SNAPSHOT_TAG}"

          echo "Pushed ${REGISTRY}-base:${SNAPSHOT_TAG}"
          echo "Pushed ${REGISTRY}-full:${SNAPSHOT_TAG}"

  benchmark:
    name: Performance Benchmarks
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    continue-on-error: true
    runs-on:
      - self-hosted
      - linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Install coordinare and performer packages
        run: |
          uv venv
          uv pip install -e "."
          uv pip install -e "agent/performer[dev]"

      - name: Run performance benchmarks (T067)
        run: uv run --extra dev pytest tests/benchmarks/test_performer_perf.py -v -m benchmark

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmarks/results/
          if-no-files-found: ignore

  build-success:
    name: Build Success
    # always() prevents skipped upstream jobs (e.g. benchmark on non-performer PRs)
    # from silently skipping this gate job. The failure/cancelled checks ensure
    # we only succeed when all required jobs passed.
    if: >-
      always() &&
      (github.event_name != 'pull_request' || !github.event.pull_request.draft) &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on:
      - self-hosted
      - linux
    needs:
      - lint
      - test
      - coverage
      - e2e
      - performer
      - docker
      - benchmark
    steps:
      - name: Mark build successful
        run: echo "Lint, tests, coverage, performer tests, E2E browser tests, Docker image builds, and benchmarks passed. Build successful."
