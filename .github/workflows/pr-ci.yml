name: Pull Request CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# General Linux builds use the ephemeral cluster pool; the persistent WSL2
# runner also matches linux/x64 but has repeatedly stalled Docker operations.
jobs:
  lint:
    name: Lint
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on:
      - self-hosted
      - linux
      - x64
      - cluster
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Run Ruff
        run: uv run --extra dev ruff check src tests agent/performer/src

      - name: Ruff baseline (432 ratchet)
        run: uv run --extra dev python scripts/ruff_baseline.py

      - name: Typecheck (433 ratchet)
        run: uv run --extra dev mypy -p coordinare

  test:
    name: Test
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on:
      - self-hosted
      - linux
      - x64
      - cluster
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Install coordinare and performer packages
        run: |
          uv venv
          uv pip install -e ".[dev]"
          uv pip install -e "agent/performer[dev]"

      - name: Run pytest
        run: uv run pytest

  chart:
    name: Chart
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on:
      - self-hosted
      - linux
      - x64
      - cluster
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      # A separate job rather than steps bolted onto Test: the chart assertions
      # need helm, and without it they would *skip* inside Test and read as a
      # pass. A check that silently verifies nothing is worse than no check.
      - name: Install helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Install coordinare
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Lint the chart
        run: helm lint deploy/helm/coordinare

      - name: Verify the rendered chart
        # Both files. test_146 asserts the controller Pod cannot match the orphan
        # sweep, which it checks by RENDERING the chart — so it needs helm, skips in
        # the Test job that lacks it, and would otherwise be verified nowhere.
        run: |
          uv run pytest tests/unit/test_147_helm_deployment.py \
                        tests/unit/test_146_kubernetes_transport.py \
                        tests/unit/test_225_kubernetes_egress.py -v

  daemon-image:
    name: Daemon Image
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on:
      - self-hosted
      - linux
      - x64
      - cluster
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Install coordinare
        run: |
          uv venv
          uv pip install -e ".[dev]"

      # The Docker deployment path had no coverage at all, and was unbuildable
      # for months before anyone noticed (#223). The image is built and published
      # by main-branch-build.yml, so without this a break is only discovered
      # after merge, by the release pipeline.
      - name: Verify the daemon image builds and runs
        run: uv run pytest tests/integration/test_148_docker_daemon_image.py -v

  chart-install:
    name: Chart Install (kind)
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on:
      - self-hosted
      - linux
      - x64
      - cluster
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      # kind and helm are not used by any other workflow, so their presence on a
      # self-hosted runner cannot be assumed. Both are single binaries.
      - name: Install helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Install kind
        uses: helm/kind-action@v1
        with:
          cluster_name: coordinare-ci
          wait: 120s

      - name: Build and load the daemon image
        run: |
          docker build -t coordinare-daemon:dev -f Dockerfile.daemon .
          kind load docker-image coordinare-daemon:dev --name coordinare-ci

      # 159: the pod-level e2e needs the performer image in the cluster. Built
      # from Dockerfile.base rather than :full -- the test starts a Pod and talks
      # to its /status, which base serves, and full adds several minutes of
      # toolchain to every PR for nothing this test asserts.
      - name: Build and load the performer image
        run: |
          docker build -t coordinare-performer:base -f agent/performer/Dockerfile.base .
          kind load docker-image coordinare-performer:base --name coordinare-ci

      - name: Install coordinare
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Install the chart and verify it
        run: uv run pytest tests/integration/test_147_helm_install.py -v

      # Spec 146's SC-001 lives here. Until now the Kubernetes performer path was
      # exercised by nothing that runs on its own, so "it works on Kubernetes"
      # rested on a hand-run spike.
      #
      # -rs and the grep are load-bearing: this file SKIPS when no cluster is
      # reachable, and a skip in CI is indistinguishable from a pass. Its own
      # docstring names that as the failure mode it exists to avoid.
      - name: Verify performers run as Pods
        # The runner is itself a Pod in the cluster cluster (ARC), so
        # load_incluster_config() SUCCEEDS here and wins over the kind kubeconfig
        # -- the runtime under test would talk to cluster with the runner's own
        # service account. It surfaced as sixteen 403s from
        # system:serviceaccount:github-actions:... rather than anything about
        # coordinare. Blanking these two makes in-cluster detection fail, so the
        # client falls back to the kubeconfig kind-action wrote, which is the
        # cluster this job built.
        #
        # Worth knowing beyond CI: coordinare's k8s runtime prefers in-cluster
        # credentials by design (that is its supported deployment), so anything
        # exercising it from inside a cluster targets THAT cluster whatever the
        # kubeconfig says.
        env:
          KUBERNETES_SERVICE_HOST: ""
          KUBERNETES_SERVICE_PORT: ""
        run: |
          set -euo pipefail
          # A per-run file: "${RUNNER_TEMP}" is scoped to the job, where /tmp is
          # whatever the runner host shares.
          log="${RUNNER_TEMP:-/tmp}/e2e-${GITHUB_RUN_ID:-local}-${GITHUB_JOB:-job}.txt"
          uv run pytest tests/integration/test_146_kind_e2e.py -v -rs 2>&1 | tee "$log"

          # Every way this file can report having proved nothing. A skip is the
          # one it is designed to do when no cluster is reachable, but a suite
          # that xfails, deselects or collects nothing is equally vacuous and
          # equally green.
          if grep -qE "^SKIPPED|[0-9]+ (skipped|xfailed|xpassed|deselected)|no tests ran|collected 0 items" "$log"; then
            echo "::error::the Kubernetes pod e2e did not actually run here; it proves nothing"
            exit 1
          fi
          # And it must have positively passed something.
          if ! grep -qE "[0-9]+ passed" "$log"; then
            echo "::error::the Kubernetes pod e2e reported no passing tests"
            exit 1
          fi

  coverage:
    name: Coverage
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on:
      - self-hosted
      - linux
      - x64
      - cluster
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Install coordinare and performer packages
        run: |
          uv venv
          uv pip install -e ".[dev]"
          uv pip install -e "agent/performer[dev]"

      - name: Run coverage
        run: uv run pytest --cov=coordinare --cov-report=term-missing --cov-fail-under=90

  e2e:
    name: E2E Browser Tests
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on:
      - self-hosted
      - linux
      - x64
      - cluster
    # Browser OS libraries live in the official image, so this lane does not
    # require passwordless sudo on whichever self-hosted runner receives it.
    # Keep the image version aligned with the Playwright package in uv.lock.
    container:
      image: mcr.microsoft.com/playwright/python:v1.58.0-noble
      options: --ipc=host
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Install Playwright browsers
        run: uv run --extra dev playwright install chromium firefox

      - name: Run E2E tests
        # Actions mounts /github/home with the host runner UID. Firefox refuses
        # to run as container root with that foreign-owned home directory.
        env:
          HOME: /root
        run: uv run --extra dev pytest tests/e2e/ --override-ini="addopts=" --browser chromium --browser firefox -v

  performer:
    name: Performer Tests
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on:
      - self-hosted
      - linux
      - x64
      - cluster
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Install coordinare and performer packages
        run: |
          uv venv
          uv pip install -e "."
          uv pip install -e "agent/performer[dev]"

      - name: Run performer tests
        run: uv run pytest agent/performer/tests/ -q --ignore=agent/performer/tests/integration

  docker:
    name: Docker Images
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on:
      - self-hosted
      - linux
      - x64
      - cluster
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Check out the branch tip (not the triggering SHA) so that any version
          # image tag is derived from the commit, so no version file is involved.
          ref: ${{ github.head_ref }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build base image
        run: docker build -t coordinare-performer:base -f agent/performer/Dockerfile.base .

      - name: Build full image
        run: docker build -t coordinare-performer:full -f agent/performer/Dockerfile.full agent/performer/

      - name: Verify image size gap (SC-007 — full must be ≥ 150 MB larger than base)
        run: |
          python3 - <<'EOF'
          import subprocess, json
          base = int(json.loads(subprocess.check_output(
            ["docker", "inspect", "--format", "{{json .Size}}", "coordinare-performer:base"])))
          full = int(json.loads(subprocess.check_output(
            ["docker", "inspect", "--format", "{{json .Size}}", "coordinare-performer:full"])))
          gap = full - base
          print(f"base={base/1e6:.0f} MB  full={full/1e6:.0f} MB  gap={gap/1e6:.0f} MB")
          assert gap >= 150_000_000, f"SC-007 FAIL: gap {gap/1e6:.0f} MB < 150 MB (Node.js LTS missing?)"
          print("SC-007 PASS")
          EOF

      - name: Push snapshot images to GHCR
        run: |
          REGISTRY=$(cat registry)
          # Identify a PR snapshot by its commit rather than by a version file.
          # That file was the source of the stranded-PR-head problem (#215): a
          # CalVer string stored on the branch goes stale, so CI had to bump and
          # push it, and a GITHUB_TOKEN push does not re-trigger CI. A snapshot
          # is better identified by the commit it was built from in any case.
          SNAPSHOT_TAG="$(git rev-parse --short HEAD)-SNAPSHOT"

          docker tag coordinare-performer:base "${REGISTRY}-base:${SNAPSHOT_TAG}"
          docker tag coordinare-performer:full "${REGISTRY}-full:${SNAPSHOT_TAG}"

          docker push "${REGISTRY}-base:${SNAPSHOT_TAG}"
          docker push "${REGISTRY}-full:${SNAPSHOT_TAG}"

          echo "Pushed ${REGISTRY}-base:${SNAPSHOT_TAG}"
          echo "Pushed ${REGISTRY}-full:${SNAPSHOT_TAG}"

  benchmark:
    name: Performance Benchmarks
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    continue-on-error: true
    runs-on:
      - self-hosted
      - linux
      - x64
      - cluster
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Install coordinare and performer packages
        run: |
          uv venv
          uv pip install -e "."
          uv pip install -e "agent/performer[dev]"

      - name: Run performance benchmarks (T067)
        run: uv run --extra dev pytest tests/benchmarks/test_performer_perf.py -v -m benchmark

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmarks/results/
          if-no-files-found: ignore

  build-success:
    name: Build Success
    # always() prevents skipped upstream jobs (e.g. benchmark on non-performer PRs)
    # from silently skipping this gate job. The failure/cancelled checks ensure
    # we only succeed when all required jobs passed.
    if: >-
      always() &&
      (github.event_name != 'pull_request' || !github.event.pull_request.draft) &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on:
      - self-hosted
      - linux
      - x64
      - cluster
    needs:
      - lint
      - test
      - coverage
      - e2e
      - performer
      - docker
      - benchmark
    steps:
      - name: Mark build successful
        run: echo "Lint, tests, coverage, performer tests, E2E browser tests, Docker image builds, and benchmarks passed. Build successful."
