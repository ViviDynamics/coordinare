[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "performer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "aiohttp>=3.9",
    "psutil>=5.9",
    "structlog>=24.1",
    "websockets>=14.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "pytest-timeout>=0.6",
    "respx>=0.21",
    # coordinare installed separately: pip install -e ../../ (see T033 / README)
]

[project.scripts]
performer = "performer.main:main"
performer-upload-screenshot = "performer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.report]
fail_under = 90

[tool.ruff]
line-length = 100
