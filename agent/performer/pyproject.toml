[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "performer"
version = "0.1.0"
# Covered by the repository-root LICENSE and NOTICE (Elastic License 2.0).
# No separate license file here, and no OSI classifier.
license = "LicenseRef-Elastic-License-2.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "aiohttp>=3.9",
    "psutil>=5.9",
    "structlog>=24.1",
    "websockets>=14.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pyyaml>=6",
    "coordinare-service-inference",
    "coordinare-ci-detection",
]

[tool.uv.sources]
coordinare-service-inference = { path = "../../packages/service_inference", editable = true }
coordinare-ci-detection = { path = "../../packages/ci_detection", editable = true }

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "pytest-timeout>=0.6",
    "respx>=0.21",
    # coordinare installed separately: pip install -e ../../ (see T033 / README)
]

[project.scripts]
performer = "performer.main:main"
performer-upload-screenshot = "performer.cli:main"
performer-fetch-ci-log = "performer.cli:fetch_ci_log_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.report]
fail_under = 90

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Ruff's defaults (E4, E7, E9, F) plus the hygiene rules 440 binds explicitly:
# no print in library code, no hardcoded secrets, no partial executable paths.
select = ["E4", "E7", "E9", "F", "T201", "S105", "S607"]

[tool.ruff.lint.per-file-ignores]
# 440: the CLI's stdout tables are the product (T201), the tool-budget hook
# speaks one JSON line on stdout by contract (T201), and the git-show parser
# compares argv tokens to the literal "git" while the scanner substitutes the
# changed-file list at a "{{files}}" placeholder — none of these are secrets
# (S105).
"src/performer/cli.py" = ["T201"]
"src/performer/backends/_tool_budget_hook.py" = ["T201"]
"src/performer/workflows/security/**" = ["S105"]
# 438: the decomposition keeps the `patch("performer.main.<name>")` surface
# intact, which forces three shapes ruff would otherwise flag. Collaborators
# are imported at call time (a module-level from-import binds before the
# test's monkeypatch); status-path builders late-bind via `from performer
# import main as _m` preambles (a module-level import would be circular);
# extracted phase helpers legitimately need 6 args and >6 return paths.
"src/performer/main.py" = ["PLC0415", "PLR0911", "PLR0913"]
"src/performer/status_paths.py" = ["PLC0415", "PLR0911", "PLR0913"]
# 521: BackendAdapter.start's keyword tuning knobs (model/effort/temperature/
# max_tokens) are the protocol's shape (base.py) — every adapter counts them.
"src/performer/backends/driver.py" = ["PLR0913"]
