[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coordinare"
version = "0.1.0"
description = "Board orchestrator daemon that dispatches project cards to AI agents"
# Elastic License 2.0 has no SPDX identifier (SPDX lists OSI/FSF licenses only), so
# PEP 639's LicenseRef- form is the specified way to name it. Deliberately no
# "License ::" classifier: every one of those asserts OSI approval.
license = "LicenseRef-Elastic-License-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "anthropic>=0.40",
    "gql[aiohttp]>=3.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "structlog>=24.1",
    "slack-sdk>=3.33",
    "aiosmtplib>=3.0",
    "prometheus-client>=0.21",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "stamina>=24.2.0,<25",
    "PyJWT[crypto]>=2.8",
    "jinja2>=3.1",
    "coordinare-service-inference",
    "coordinare-ci-detection",
    # Spec 146 (#200): the Kubernetes transport. The alternative is hand-rolling
    # REST against the API server including in-cluster ServiceAccount token
    # handling, TLS trust, and watch semantics — more code, and code that is
    # wrong in ways only production reveals.
    "kubernetes>=31.0",
]

[tool.uv.sources]
coordinare-service-inference = { path = "packages/service_inference", editable = true }
coordinare-ci-detection = { path = "packages/ci_detection", editable = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-playwright>=0.5",
    "pytest-timeout>=2.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
    "jsonschema>=4.26.0",
    "openapi-spec-validator>=0.7",
    "mutmut>=3.8",
]

[project.scripts]
coordinare = "coordinare.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/coordinare"]

# T003: Ruff configuration
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
exclude = [".codex", ".claude", "specs"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "TCH",   # flake8-type-checking
    "RUF",   # ruff-specific rules
    "C4",    # flake8-comprehensions (432: zero-debt after autofix sweep)
    "RET",   # flake8-return (432)
    "PIE",   # flake8-pie (432)
    "FURB",  # refurb (432)
    "COM",   # flake8-commas (432: trailing commas enforced by the autofix sweep)
    "T201",  # 440: no print in library code; CLI entry points are exempt below
    "S607",  # 440: no partial executable paths; resolve via shutil.which at module load
]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
# 440: test files need runtime annotation imports; tests may print diagnostics.
# Integration tests probe the ambient toolchain (docker, kubectl, bash, node,
# psql) by design, and unit tests drive fixture git repos; PATH lookup is the
# interface being exercised, so S607 (partial executable path) is exempt here.
"tests/**" = ["TC001", "TC002", "TC003", "T201", "S607"]
"src/coordinare/__main__.py" = ["E402", "T201"]  # CLI entry point; T201: user-facing output is the interface
# 435: monitor decomposition helpers are keyword-only by design; the arg count
# is the price of keeping each extracted phase helper <= 100 lines.
"src/coordinare/graph/nodes/monitor/**" = ["PLR0913"]
# 437: check_board decomposition helpers take the context they need; the arg
# count is the price of keeping each extracted phase helper <= 100 lines.
"src/coordinare/graph/nodes/check_board.py" = ["PLR0913"]
# 437: dispatch decomposition passes the env-cache/subprocess context through
# phase helpers; the arg count is the price of keeping each extracted
# phase helper <= 100 lines.
"src/coordinare/graph/nodes/dispatch_performer.py" = ["PLR0913"]
# 437: daemon decomposition helpers take the context they need; the arg count
# is the price of keeping each extracted phase helper <= 100 lines.
"src/coordinare/daemon.py" = ["PLR0913"]
# 440: eval scenarios drive the harness with fixture tokens (like "t"), never
# real credentials; the scenario files are standalone CLI entry points whose
# scenario reports are stdout output. Their git fixture setup passes static,
# repo-local command lists (S603's dynamic-list heuristic fires on any
# variable-headed list, hence the ignore).
"src/coordinare/eval/**" = ["S106", "T201", "S603"]
# 440: fake_github and the bench fixtures run a fixed, repo-local git
# vocabulary over their own fixture paths — no user input reaches the command
# lists. S603 stays live everywhere a config-supplied command is really run
# (monitor/verdict.py, security_scanner.py).
"src/coordinare/services/fake_github.py" = ["S603"]
"src/coordinare/bench/fixtures.py" = ["S603"]
# 440: remaining S105 hits are not credentials (triaged in the issue): a URL
# template, a display mask, and validator placeholders that never carry a
# real token.
"src/coordinare/auth/app.py" = ["S105"]
"src/coordinare/config_descriptors.py" = ["S105"]
"src/coordinare/services/config_write_service.py" = ["S105"]
# 440: benchmark report tools and the bench stub are standalone CLI entry
# points (python -m coordinare.bench....); their stdout tables are the product.
"src/coordinare/bench/**" = ["T201"]
# 440: startup config validation writes an actionable error to stderr and
# SystemExits before the daemon's structured pipeline is up.
"src/coordinare/auth/__init__.py" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["coordinare"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# T004: Mypy configuration
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "gql.*",
    "aiosmtplib.*",
    "slack_sdk.*",
    "prometheus_client.*",
    "coordinare_service_inference.*",
    "performer.*",
    "kubernetes",
    "kubernetes.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true

[[tool.mypy.overrides]]
# 433 ratchet: per-module strict-mypy allowlist. Covers exactly the files that
module = [
    "coordinare.auth",
    "coordinare.daemon",
    "coordinare.eval.implementer_scenarios",
    "coordinare.eval.qa_scenarios",
    "coordinare.graph.nodes.assess_card",
    "coordinare.graph.nodes.handle_blocked",
    "coordinare.protocol",
    "coordinare.services.config_write_service",
    "coordinare.services.rebase",
    "coordinare.services.reconciliation",
    "coordinare.services.security_scanner",
    "coordinare.session",
]
ignore_errors = true

# T005: Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 30
addopts = "-m 'not e2e'"
markers = [
    "unit: Unit tests (fast, no external dependencies)",
    "integration: Integration tests (may use in-memory services)",
    "contract: Contract tests (validate API schemas)",
    "e2e: End-to-end browser tests (require Playwright browser binaries)",
    "benchmark: Performance benchmark tests (require Docker; emit JSON results)",
    "lmstudio: LM Studio integration tests (gated by LMSTUDIO_AVAILABLE=1; spec 067)",
    # 151: the single real-model board-sim run. DELIBERATELY skipped unless
    # RUN_REAL_BENCH is set (opt-in paid/Docker lane) — the free deterministic lane
    # (SC-006) stays green without it. Tracked justification for Constitution II
    # "no untracked skips": the skip is this spec's opt-in real lane, not an escape.
    "real: Real-model board-sim benchmark (opt-in; requires RUN_REAL_BENCH + Docker + a model endpoint)",
]
filterwarnings = [
    # 440: no blanket ignore::DeprecationWarning — deprecation debt must surface
    # in test output. Narrow, justified ignores live here; add one per offending
    # dependency with the reason, and delete it when the dependency moves.

    # langchain_core uses pydantic v1 internals not supported on Python 3.14+
    "ignore:Core Pydantic V1 functionality:UserWarning:langchain_core",
]

[tool.coverage.run]
source = ["src/coordinare"]
branch = true
# __main__.py is the CLI entry point — its async main() function (daemon
# bootstrap, service wiring, argparse) can't be reached by unit tests.
# Helper functions extracted from it ARE tested via test_main_coverage.py
# and test_bootstrap.py.
omit = ["src/coordinare/__main__.py"]

# Keep pytest-cov exit status aligned with its two-decimal summary: otherwise
# 89.92% rounds to 90% and exits successfully while printing a failure.
[tool.coverage.report]
precision = 2
show_missing = true
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "class \\w+.*Protocol.*:",
    "\\.\\.\\.$",
]

[dependency-groups]
dev = []

# 439: mutation-testing pilot on the dispatch and monitoring core services.
# mutmut copies the sources into mutants/, mutates the copies, and runs pytest
# incrementally against them, so this is safe alongside the normal suite.
# Run locally from the repo root: `uv run mutmut run` (or `mutmut run` with the
# venv active). Baseline scores and survivor triage live in
# docs/qa/2026-09-25-mutation-testing-pilot.md.
[tool.mutmut]
# All of src is copied into mutants/ (the tests must import the whole package,
# __init__.py and all); only_mutate restricts actual mutation to the six pilot
# files. Pointing source_paths at the six files directly instead leaves
# mutants/src/coordinare without an __init__.py, the tests then import the
# installed (unmutated) package, and every mutant "survives" for a reason that
# has nothing to do with test quality.
source_paths = ["src"]
only_mutate = [
    "src/coordinare/services/dispatch_guard.py",
    "src/coordinare/services/retry_counter.py",
    "src/coordinare/services/no_progress.py",
    "src/coordinare/services/base_gate.py",
    "src/coordinare/services/failure_classification.py",
    "src/coordinare/services/required_checks_resolver.py",
]
# The selection must contain every test that reaches the pilot modules:
# tests/unit as a whole also runs the repo-artifact suite (LICENSE, README, bin/
# scripts), which reads files mutmut does not copy into mutants/ and fails there
# — and none of those tests touch the pilot modules, so excluding them costs
# nothing in verdict quality. tests/unit/services has the dedicated files,
# tests/unit/graph the node-level callers, and the two root files are the only
# root-level importers of the pilot modules.
pytest_add_cli_args_test_selection = [
    "tests/unit/services",
    "tests/unit/graph",
    "tests/unit/test_335_watchdog_graph.py",
    "tests/unit/test_390_no_progress_budget.py",
]
# Exclude lines whose mutation is never worth a verdict: logging calls have no
# assertable return value, and exception-construction lines are exercised via
# the surrounding verdict logic (which stays mutated). Lines matching any
# pattern are skipped entirely.
do_not_mutate_patterns = [
    "^\\s*log\\.",
    "structlog.get_logger",
    "\\braise\\b",
]
# The stats run happens in mutmut's own process, whose stdout is the live UI
# capture; a module-level structlog logger imported there binds the closed
# capture and the first test that logs raises "I/O operation on closed file".
# Forking a clean server process for the test runs sidesteps it.
process_isolation = "forkserver"
# 433-sequencing note: the mypy type-check filter (type_check_command) was
# tried and is deliberately OFF for the pilot. Both runs of `mypy -p coordinare`
# inside mutants/ produced diagnostics mutmut cannot map to a mutant —
# "Unused type: ignore comment" (suppressed with --no-warn-unused-ignores, but
# then) "module is installed, but missing library stubs or py.typed marker" on
# an import line — and mutmut aborts ("Could not find mutant for type error")
# on any diagnostic it cannot attribute to a mutant's line range. Revisit when
# upstream handles file-level diagnostics; until then invalid mutants are
# simply killed by the tests erroring, at a small compute cost.
type_check_command = []
