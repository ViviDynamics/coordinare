[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coordinare"
version = "0.1.0"
description = "Board orchestrator daemon that dispatches project cards to AI agents"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "anthropic>=0.40",
    "gql[aiohttp]>=3.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "structlog>=24.1",
    "slack-sdk>=3.33",
    "aiosmtplib>=3.0",
    "prometheus-client>=0.21",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "stamina>=24.2.0,<25",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-playwright>=0.5",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
    "jsonschema>=4.20",
]

[project.scripts]
coordinare = "coordinare.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/coordinare"]

# T003: Ruff configuration
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
exclude = [".codex", ".claude", "specs"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "TCH",   # flake8-type-checking
    "RUF",   # ruff-specific rules
]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["TC001", "TC002", "TC003"]  # test files need runtime access to type-annotation imports

[tool.ruff.lint.isort]
known-first-party = ["coordinare"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# T004: Mypy configuration
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "gql.*",
    "aiosmtplib.*",
    "slack_sdk.*",
    "prometheus_client.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true

# T005: Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not e2e'"
markers = [
    "unit: Unit tests (fast, no external dependencies)",
    "integration: Integration tests (may use in-memory services)",
    "contract: Contract tests (validate API schemas)",
    "e2e: End-to-end browser tests (require Playwright browser binaries)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    # langchain_core uses pydantic v1 internals not supported on Python 3.14+
    "ignore:Core Pydantic V1 functionality:UserWarning:langchain_core",
]

[tool.coverage.run]
source = ["src/coordinare"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "class \\w+.*Protocol.*:",
    "\\.\\.\\.$",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
]
